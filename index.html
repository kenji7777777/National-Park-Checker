    // Fallback: if the app hasn't mounted within a few seconds (CDN blocked,
    // offline, or a script error), replace the loading state with a visible
    // diagnostic message instead of staying blank forever.
    window.__bootOk = false;
    window.addEventListener("error", function (e) {
      showBootError((e && e.message) ? e.message : "Unknown script error");
    });
    function showBootError(detail) {
      if (window.__bootOk) return;
      var el = document.getElementById("boot-status");
      if (!el) return;
      el.innerHTML =
        '<div style="max-width:420px;">' +
        '<div style="font-size:28px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-size:15px;margin-bottom:10px;">Failed to load the app.</div>' +
        '<div style="font-size:12px;opacity:0.75;margin-bottom:14px;">This page needs an internet connection the first time it loads (it fetches React from a CDN). If you opened this file directly on your phone, try opening it from its GitHub Pages web link instead.</div>' +
        '<div style="font-size:10px;opacity:0.5;word-break:break-word;">' + String(detail).replace(/</g,"&lt;") + '</div>' +
        '</div>';
    }
    window.__bootTimer = setTimeout(function () {
      if (!window.__bootOk) showBootError("Timed out waiting for the app to start (CDN scripts may be blocked or still loading).");
    }, 8000);
  </script>

  <script>
    const manifest = {
      name: "US National Parks Checklist",
      short_name: "NatParks",
      start_url: ".",
      display: "standalone",
      background_color: "#0a0f0a",
      theme_color: "#1a2e1a",
      icons: [
        { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a2e1a'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%F0%9F%8F%9C%EF%B8%8F%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    document.getElementById("manifest-link").href = URL.createObjectURL(manifestBlob);

    if ("serviceWorker" in navigator) {
      const swCode = `
        const CACHE_NAME = "natparks-v9";
        self.addEventListener("install", (e) => {
          self.skipWaiting();
        });
        self.addEventListener("activate", (e) => {
          e.waitUntil(
            caches.keys().then((keys) =>
              Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
            ).then(() => clients.claim())
          );
        });
        self.addEventListener("fetch", (e) => {
          if (e.request.method !== "GET") return;
          e.respondWith(
            caches.open(CACHE_NAME).then((cache) =>
              cache.match(e.request).then((cached) => {
                const fetchPromise = fetch(e.request).then((networkResponse) => {
                  if (networkResponse && networkResponse.status === 200) {
                    cache.put(e.request, networkResponse.clone());
                  }
                  return networkResponse;
                }).catch(() => cached);
                return cached || fetchPromise;
              })
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(swBlob);
      window.addEventListener("load", () => {
        navigator.serviceWorker.register(swUrl).catch(() => {});
      });
    }

    function updateOnlineStatus() {
      const banner = document.getElementById("offline-banner");
      if (navigator.onLine) banner.classList.remove("show");
      else banner.classList.add("show");
    }
    window.addEventListener("online", updateOnlineStatus);
    window.addEventListener("offline", updateOnlineStatus);
    updateOnlineStatus();

    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!sessionStorage.getItem("installDismissed") && !window.matchMedia("(display-mode: standalone)").matches) {
        document.getElementById("install-prompt").classList.add("show");
      }
    });
    document.getElementById("install-btn").addEventListener("click", async () => {
      document.getElementById("install-prompt").classList.remove("show");
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });
    document.getElementById("dismiss-btn").addEventListener("click", () => {
      document.getElementById("install-prompt").classList.remove("show");
      sessionStorage.setItem("installDismissed", "1");
    });
  </script>

// ── National Park Streak: longest run of parks visited on one trip ──
// Visits within TRIP_GAP_DAYS of each other are grouped into the same "trip".
const TRIP_GAP_DAYS = 7;

function computeTripStreaks(visits) {
  // Flatten all visits into { parkId, date } entries, sorted chronologically
  const entries = [];
  Object.entries(visits).forEach(([parkId, arr]) => {
    (arr || []).forEach(v => entries.push({ parkId: Number(parkId), date: v.date }));
  });
  entries.sort((a, b) => a.date.localeCompare(b.date));
  if (entries.length === 0) return { trips: [], longest: null };

  const dayMs = 24 * 60 * 60 * 1000;
  const trips = [];
  let current = [entries[0]];

  for (let i = 1; i < entries.length; i++) {
    const prevDate = new Date(current[current.length-1].date + "T12:00:00");
    const currDate = new Date(entries[i].date + "T12:00:00");
    const gapDays = Math.round((currDate - prevDate) / dayMs);
    if (gapDays <= TRIP_GAP_DAYS) {
      current.push(entries[i]);
    } else {
      trips.push(current);
      current = [entries[i]];
    }
  }
  trips.push(current);

  // Dedupe park IDs within each trip (a park visited twice in the same trip counts once)
  const tripSummaries = trips.map(trip => {
    const uniqueParkIds = [...new Set(trip.map(e => e.parkId))];
    return {
      parkIds: uniqueParkIds,
      startDate: trip[0].date,
      endDate: trip[trip.length-1].date,
      count: uniqueParkIds.length,
    };
  });

  const longest = tripSummaries.reduce((best, t) => (!best || t.count > best.count) ? t : best, null);
  return { trips: tripSummaries, longest };
}

function formatDate(iso, isJa) {
  const d = new Date(iso + "T12:00:00");
  if (isJa) return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  return d.toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" });
}

// ── SVG Map (simple linear lat/lng projection — no distortion) ────
const MAP_W = 800, MAP_H = 500;
const MAP_BOUNDS = { minLng:-125, maxLng:-66, minLat:24, maxLat:50 };

function project(lat, lng) {
  const x = (lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng) * MAP_W;
  const y = (MAP_BOUNDS.maxLat - lat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat) * MAP_H;
  return { x, y };
}

function SVGMap({ parks, checked, visits, isJa, onParkClick, hoveredId, setHoveredId, themeColors }) {
  const contiguous = parks.filter(p=>!["Alaska","Hawaii","American Samoa","U.S. Virgin Islands"].includes(p.state));
  const outside    = parks.filter(p=> ["Alaska","Hawaii","American Samoa","U.S. Virgin Islands"].includes(p.state));

  const [zoom, setZoom]   = useState(1);
  const [pan,  setPan]    = useState({x:0,y:0});
  const dragRef = useRef({dragging:false, startX:0, startY:0, panX:0, panY:0});
  const pinchRef = useRef({active:false, startDist:0, startZoom:1});
  const svgRef = useRef(null);

  const MIN_ZOOM = 1, MAX_ZOOM = 6;

  const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

  const zoomBy = (factor, cx=MAP_W/2, cy=MAP_H/2) => {
    setZoom(prevZoom => {
      const newZoom = clamp(prevZoom * factor, MIN_ZOOM, MAX_ZOOM);
      setPan(prevPan => {
        // Zoom toward the given center point (keeps that point stable)
        const scaleDelta = newZoom / prevZoom;
        const nx = cx - (cx - prevPan.x) * scaleDelta;
        const ny = cy - (cy - prevPan.y) * scaleDelta;
        return clampPan(nx, ny, newZoom);
      });
      return newZoom;
    });
  };

  const clampPan = (x, y, z) => {
    const maxPanX = (MAP_W * z - MAP_W) ;
    const maxPanY = (MAP_H * z - MAP_H) ;
    return { x: clamp(x, -maxPanX, 0), y: clamp(y, -maxPanY, 0) };
  };

  const resetView = () => { setZoom(1); setPan({x:0,y:0}); };

  // Mouse drag pan
  const onPointerDown = (e) => {
    const p = e.touches ? e.touches[0] : e;
    dragRef.current = { dragging:true, startX:p.clientX, startY:p.clientY, panX:pan.x, panY:pan.y };
  };
  const onPointerMove = (e) => {
    if (e.touches && e.touches.length === 2) { handlePinch(e); return; }
    if (!dragRef.current.dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = MAP_W / rect.width, scaleY = MAP_H / rect.height;
    const dx = (p.clientX - dragRef.current.startX) * scaleX;
    const dy = (p.clientY - dragRef.current.startY) * scaleY;
    setPan(clampPan(dragRef.current.panX + dx, dragRef.current.panY + dy, zoom));
  };
  const onPointerUp = () => { dragRef.current.dragging = false; pinchRef.current.active = false; };

  // Touch pinch-to-zoom
  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      const dist = touchDist(e.touches);
      pinchRef.current = { active:true, startDist:dist, startZoom:zoom };
    } else if (e.touches.length === 1) {
      onPointerDown(e);
    }
  };
  const touchDist = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  };
  const handlePinch = (e) => {
    if (!pinchRef.current.active) return;
    const dist = touchDist(e.touches);
    const scale = dist / pinchRef.current.startDist;
    const newZoom = clamp(pinchRef.current.startZoom * scale, MIN_ZOOM, MAX_ZOOM);
    setZoom(newZoom);
    setPan(p => clampPan(p.x, p.y, newZoom));
  };

  // Wheel zoom (desktop)
  const onWheel = (e) => {
    e.preventDefault();
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = MAP_W / rect.width, scaleY = MAP_H / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;
    zoomBy(e.deltaY < 0 ? 1.2 : 1/1.2, cx, cy);
  };

  const viewBoxStr = `${-pan.x/zoom} ${-pan.y/zoom} ${MAP_W/zoom} ${MAP_H/zoom}`;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8,padding:"0 12px 8px"}}>
      <div style={{position:"relative"}}>
        <svg ref={svgRef} viewBox={viewBoxStr}
          style={{width:"100%",background:themeColors.mapBg,borderRadius:10,border:`1px solid ${themeColors.mapBorder}`,display:"block",touchAction:"none",cursor:dragRef.current.dragging?"grabbing":"grab"}}
          onMouseDown={onPointerDown} onMouseMove={onPointerMove} onMouseUp={onPointerUp} onMouseLeave={onPointerUp}
          onTouchStart={onTouchStart} onTouchMove={onPointerMove} onTouchEnd={onPointerUp}
          onWheel={onWheel}>
          {/* Land mass */}
          <path d={US_OUTLINE} fill={themeColors.mapLand} stroke={themeColors.mapLandBorder} strokeWidth={1.5/zoom} strokeLinejoin="round"/>
          {/* Reference grid */}
          {[0,1,2,3,4,5,6,7].map(i=><line key={`v${i}`} x1={i*100} y1="0" x2={i*100} y2={MAP_H} stroke={themeColors.mapGrid} strokeWidth={0.5/zoom}/>)}
          {[0,1,2,3,4,5].map(i=><line key={`h${i}`} x1="0" y1={i*100} x2={MAP_W} y2={i*100} stroke={themeColors.mapGrid} strokeWidth={0.5/zoom}/>)}
          {/* State abbreviation labels */}
          {STATE_LABELS.map(s=>(
            <text key={s.ab} x={s.x} y={s.y} fontSize={7/zoom} fill={themeColors.mapStateLabel} textAnchor="middle" style={{userSelect:"none",pointerEvents:"none"}}>{s.ab}</text>
          ))}

          {contiguous.map(park=>{
            const {x,y}=project(park.lat,park.lng);
            if(x<0||x>MAP_W||y<0||y>MAP_H) return null;
            const isChk=checked[park.id], cnt=visits[park.id]?.length??0, isHov=hoveredId===park.id;
            const r=(isHov?9:6.5)/Math.sqrt(zoom); // pins shrink slightly on zoom so map doesn't get cluttered, but stay tappable
            return (
              <g key={park.id} style={{cursor:"pointer"}} onClick={()=>onParkClick(park)}
                onMouseEnter={()=>setHoveredId(park.id)} onMouseLeave={()=>setHoveredId(null)}>
                {/* Outer ring: unmistakable visited/unvisited signal */}
                <circle cx={x} cy={y} r={r+2.5/Math.sqrt(zoom)} fill="none" stroke={isChk?themeColors.pinVisitedRing:"none"} strokeWidth={1.5/Math.sqrt(zoom)} opacity={isChk?0.6:0}/>
                <circle cx={x+0.8} cy={y+0.8} r={r} fill="rgba(0,0,0,0.5)"/>
                <circle cx={x} cy={y} r={r} fill={isChk?themeColors.pinVisited:themeColors.pinUnvisited} stroke={isChk?themeColors.pinVisitedBorder:themeColors.pinUnvisitedBorder} strokeWidth={1.5/Math.sqrt(zoom)}/>
                {isChk
                  ? <text x={x} y={y+r*0.35} fontSize={r*1.1} textAnchor="middle" fill={themeColors.pinCheckmark} style={{userSelect:"none",pointerEvents:"none",fontWeight:"bold"}}>✓</text>
                  : <circle cx={x} cy={y} r={r*0.3} fill={themeColors.pinUnvisitedDot}/>
                }
                {cnt>1&&<text x={x+r+2/Math.sqrt(zoom)} y={y-r+2/Math.sqrt(zoom)} fontSize={8/Math.sqrt(zoom)} fill={themeColors.pinBadge} fontWeight="bold" textAnchor="middle" style={{userSelect:"none"}}>{cnt}</text>}
              </g>
            );
          })}
        </svg>

        {/* Zoom controls */}
        <div style={{position:"absolute",top:8,right:8,display:"flex",flexDirection:"column",gap:4}}>
          <button onClick={()=>zoomBy(1.4)} style={{width:28,height:28,borderRadius:6,background:"rgba(10,20,10,0.85)",border:`1px solid ${themeColors.mapBorder}`,color:themeColors.mapStateLabel,fontSize:16,cursor:"pointer",lineHeight:1}}>+</button>
          <button onClick={()=>zoomBy(1/1.4)} style={{width:28,height:28,borderRadius:6,background:"rgba(10,20,10,0.85)",border:`1px solid ${themeColors.mapBorder}`,color:themeColors.mapStateLabel,fontSize:16,cursor:"pointer",lineHeight:1}}>−</button>
          {zoom>1&&<button onClick={resetView} style={{width:28,height:28,borderRadius:6,background:"rgba(10,20,10,0.85)",border:`1px solid ${themeColors.mapBorder}`,color:themeColors.mapStateLabel,fontSize:11,cursor:"pointer",lineHeight:1}}>⟲</button>}
        </div>
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:14,justifyContent:"center",fontSize:10,color:themeColors.mapStateLabel}}>
        <span style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:themeColors.pinVisited,border:`1px solid ${themeColors.pinVisitedBorder}`,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:7,color:themeColors.pinCheckmark}}>✓</span>
          {isJa?"訪問済み":"Visited"}
        </span>
        <span style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:themeColors.pinUnvisited,border:`1px solid ${themeColors.pinUnvisitedBorder}`,display:"inline-block"}}/>
          {isJa?"未訪問":"Not yet"}
        </span>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {[{label:"Alaska",fn:p=>p.state==="Alaska"},{label:"Hawaii",fn:p=>p.state==="Hawaii"},{label:"Territories",fn:p=>["American Samoa","U.S. Virgin Islands"].includes(p.state)}].map(({label,fn})=>{
          const sub=outside.filter(fn); if(!sub.length) return null;
          return (
            <div key={label} style={{background:themeColors.cardBg,border:`1px solid ${themeColors.cardBorder}`,borderRadius:8,padding:"8px 12px",flex:1,minWidth:90}}>
              <div style={{fontSize:10,color:themeColors.mapStateLabel,marginBottom:5,fontWeight:500}}>{label}</div>
              {sub.map(park=>{
                const cnt=visits[park.id]?.length??0;
                return (
                  <div key={park.id} onClick={()=>onParkClick(park)} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",cursor:"pointer"}}>
                    <div style={{width:8,height:8,borderRadius:"50%",flexShrink:0,background:checked[park.id]?themeColors.pinVisited:themeColors.pinUnvisited,border:`1.5px solid ${checked[park.id]?themeColors.pinVisitedBorder:themeColors.pinUnvisitedBorder}`}}/>
                    <span style={{fontSize:10,color:checked[park.id]?themeColors.accentText:themeColors.mutedText}}>{park.emoji} {isJa?park.ja:park.name}</span>
                    {cnt>1&&<span style={{fontSize:9,color:themeColors.accentText}}>×{cnt}</span>}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Timeline View (chronological visit history) ────────────────────
function TimelineView({ parks, visits, isJa, themeColors, onParkClick }) {
  const T = themeColors;

  // Flatten all visits across all parks into one sorted list
  const timeline = useMemo(() => {
    const entries = [];
    parks.forEach(park => {
      (visits[park.id] || []).forEach(v => {
        entries.push({ park, date: v.date, note: v.note });
      });
    });
    return entries.sort((a, b) => b.date.localeCompare(a.date));
  }, [parks, visits]);

  // Group by year
  const byYear = useMemo(() => {
    const groups = {};
    timeline.forEach(entry => {
      const year = entry.date.slice(0, 4);
      if (!groups[year]) groups[year] = [];
      groups[year].push(entry);
    });
    return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
  }, [timeline]);

  function fmtFull(iso) {
    const d = new Date(iso + "T12:00:00");
    return isJa
      ? `${d.getMonth()+1}月${d.getDate()}日`
      : d.toLocaleDateString("en-US", { month:"long", day:"numeric" });
  }

  if (timeline.length === 0) {
    return (
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:40,color:T.mutedText,fontSize:14,textAlign:"center"}}>
        {isJa ? "まだ訪問記録がありません。\nチェックを入れて旅の記録を始めましょう。" : "No visits logged yet.\nCheck off a park to start your journey timeline."}
      </div>
    );
  }

  return (
    <div style={{flex:1,padding:"16px 20px 80px",maxWidth:600,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      {byYear.map(([year, entries]) => (
        <div key={year} style={{marginBottom:28}}>
          <div style={{fontSize:20,color:T.accentText,fontWeight:600,marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
            <span>{year}</span>
            <div style={{flex:1,height:1,background:T.cardBorder}}/>
            <span style={{fontSize:11,color:T.mutedText,fontWeight:400}}>{entries.length} {isJa?"件":entries.length===1?"visit":"visits"}</span>
          </div>
          <div style={{position:"relative",paddingLeft:20}}>
            {/* Vertical line */}
            <div style={{position:"absolute",left:5,top:6,bottom:6,width:2,background:T.cardBorder}}/>
            {entries.map((entry, i) => (
              <div key={`${entry.park.id}-${entry.date}`} onClick={()=>onParkClick(entry.park)}
                style={{position:"relative",marginBottom:16,cursor:"pointer"}}>
                {/* Dot */}
                <div style={{position:"absolute",left:-20,top:4,width:10,height:10,borderRadius:"50%",background:T.pinVisited,border:`2px solid ${T.bg}`,boxShadow:`0 0 0 2px ${T.pinVisitedBorder}`}}/>
                <div style={{background:T.cardBg,border:`1px solid ${T.cardBorder}`,borderRadius:8,padding:"10px 14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
                    <span style={{fontSize:14,color:T.textPrimary,fontWeight:500}}>{entry.park.emoji} {isJa?entry.park.ja:entry.park.name}</span>
                    <span style={{fontSize:11,color:T.mutedText,whiteSpace:"nowrap"}}>{fmtFull(entry.date)}</span>
                  </div>
                  <div style={{fontSize:10,color:T.mutedText,marginTop:2}}>{isJa?entry.park.stateJa:entry.park.state}</div>
                  {entry.note&&<div style={{fontSize:12,color:T.textSecondary,marginTop:6,fontStyle:"italic"}}>💬 {entry.note}</div>}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

                    <div style={{fontSize:10,color:T.mutedText,marginTop:1}}>{isJa?q.descJa:q.desc}</div>
                  </div>
                  {q.complete&&<span style={{fontSize:11,color:T.accentText,fontWeight:600,whiteSpace:"nowrap"}}>✓ {tx.questComplete}</span>}
                </div>
                {/* Progress bar */}
                <div style={{height:6,background:T.progressTrack,borderRadius:3,overflow:"hidden",marginBottom:8}}>
                  <div style={{height:"100%",width:`${(q.done/q.total)*100}%`,background:q.complete?T.progressFill:T.progressFill,borderRadius:3,transition:"width .3s ease"}}/>
                </div>
                <div style={{fontSize:10,color:T.mutedText,marginBottom:8}}>{tx.questProgress}: {q.done}/{q.total}</div>
                {/* Park chips */}
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {q.parkIds.map(pid => {
                    const p = parks.find(pp=>pp.id===pid);
                    if (!p) return null;
                    const done = !!checked[pid];
                    return (
                      <div key={pid} onClick={()=>onParkClick&&onParkClick(p)} style={{
                        display:"flex",alignItems:"center",gap:4,padding:"3px 8px",borderRadius:12,fontSize:10,cursor:"pointer",
                        background:done?T.chipBgActive:T.inputBg,
                        border:`1px solid ${done?T.chipBorderActive:T.cardBorder}`,
                        color:done?T.chipTextActive:T.mutedText,
                      }}>
                        {p.emoji} {isJa?p.ja:p.name} {done&&"✓"}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Stats View: streaks, mini map silhouette, state progress ───────
function StatsView({ parks, visits, checked, isJa, themeColors, tx, onParkClick }) {
  const T = themeColors;

  const { trips, longest } = useMemo(() => computeTripStreaks(visits), [visits]);
  const totalChecked = Object.values(checked).filter(Boolean).length;

  const visitedStates = useMemo(() => {
    const set = new Set();
    parks.forEach(p => { if (checked[p.id]) p.state.split(" / ").forEach(s=>set.add(s.trim())); });
    return set;
  }, [checked]);
  const totalStates = useMemo(() => {
    const set = new Set();
    parks.forEach(p => p.state.split(" / ").forEach(s=>set.add(s.trim())));
    return set;
  }, []);

  function fmtRange(startIso, endIso) {
    const s = new Date(startIso+"T12:00:00"), e = new Date(endIso+"T12:00:00");
    const fmt = (d) => isJa ? `${d.getMonth()+1}/${d.getDate()}` : d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    return startIso === endIso ? fmt(s) : `${fmt(s)} – ${fmt(e)}`;
  }

  const sortedTrips = [...trips].sort((a,b)=>b.count-a.count).slice(0,5);

  return (
    <div style={{flex:1,padding:"16px 20px 80px",maxWidth:700,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>

      {/* ── Streak highlight card ── */}
      <div style={{background:T.cardBgAlt,border:`1px solid ${T.cardBorderActive}`,borderRadius:14,padding:"20px",marginBottom:20,textAlign:"center"}}>
        <div style={{fontSize:12,color:T.mutedText,marginBottom:6,letterSpacing:"0.1em"}}>🔥 {tx.longestStreak}</div>
        {longest ? (
          <>
            <div style={{fontSize:40,fontWeight:700,color:T.accentText,lineHeight:1}}>{longest.count}</div>
            <div style={{fontSize:13,color:T.textPrimary,marginTop:4}}>{tx.parksInOneTrip(longest.count)}</div>
            <div style={{fontSize:11,color:T.mutedText,marginTop:6}}>{fmtRange(longest.startDate, longest.endDate)}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center",marginTop:12}}>
              {longest.parkIds.map(pid => {
                const p = parks.find(pp=>pp.id===pid);
                if (!p) return null;
                return (
                  <div key={pid} onClick={()=>onParkClick&&onParkClick(p)} style={{
                    padding:"4px 10px",borderRadius:12,fontSize:11,cursor:"pointer",
                    background:T.chipBgActive,border:`1px solid ${T.chipBorderActive}`,color:T.chipTextActive,
                  }}>{p.emoji} {isJa?p.ja:p.name}</div>
                );
              })}
            </div>
          </>
        ) : (
          <div style={{fontSize:13,color:T.mutedText,padding:"12px 0"}}>{tx.noStreak}</div>
        )}
      </div>

      {/* ── Mini map silhouette with visited pins ── */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:12,color:T.mutedText,marginBottom:8,letterSpacing:"0.05em"}}>🗺 {isJa?"訪問地図":"Visited Map"}</div>
        <svg viewBox={`0 0 ${MAP_W} ${MAP_H}`} style={{width:"100%",background:T.mapBg,borderRadius:10,border:`1px solid ${T.mapBorder}`,display:"block"}}>
          <path d={US_OUTLINE} fill={T.mapLand} stroke={T.mapLandBorder} strokeWidth="1.5" strokeLinejoin="round"/>
          {parks.filter(p=>!["Alaska","Hawaii","American Samoa","U.S. Virgin Islands"].includes(p.state)).map(park => {
            const {x,y} = project(park.lat, park.lng);
            if (x<0||x>MAP_W||y<0||y>MAP_H) return null;
            const isChk = checked[park.id];
            if (!isChk) return <circle key={park.id} cx={x} cy={y} r={2.5} fill={T.pinUnvisited} opacity={0.3}/>;
            return (
              <g key={park.id}>
                <circle cx={x} cy={y} r={7} fill={T.pinVisited} opacity={0.25}/>
                <circle cx={x} cy={y} r={4} fill={T.pinVisited} stroke={T.pinVisitedBorder} strokeWidth="1"/>
              </g>
            );
          })}
        </svg>
      </div>

      {/* ── Trip history (top 5 longest) ── */}
      {sortedTrips.length > 0 && (
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,color:T.mutedText,marginBottom:8,letterSpacing:"0.05em"}}>📋 {isJa?"旅の記録":"Trip History"}</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {sortedTrips.map((trip,i) => (
              <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:T.cardBg,border:`1px solid ${T.cardBorder}`,borderRadius:8}}>
                <div>
                  <div style={{fontSize:12,color:T.textPrimary}}>{tx.parksInOneTrip(trip.count)}</div>
                  <div style={{fontSize:10,color:T.mutedText,marginTop:2}}>{fmtRange(trip.startDate, trip.endDate)}</div>
                </div>
                <div style={{fontSize:18,color:T.accentText}}>{trip.count===1?"🏕️":trip.count<4?"🚗":"🔥"}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── State progress ── */}
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
          <span style={{fontSize:12,color:T.mutedText,letterSpacing:"0.05em"}}>🏳️ {isJa?"訪問した州":"States Visited"}</span>
          <span style={{fontSize:14,color:T.accentText,fontWeight:600}}>{visitedStates.size} / {totalStates.size}</span>
        </div>
        <div style={{height:6,background:T.progressTrack,borderRadius:3,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(visitedStates.size/totalStates.size)*100}%`,background:T.progressFill,borderRadius:3}}/>
        </div>
      </div>
    </div>
  );
}

        )}
      </div>
    </div>
  );
}

// ── Share Card (Canvas-generated shareable image) ──────────────────
function ShareCardModal({ profile, visits, checked, isJa, tx, onClose, earnedBadgeIds=[], earnedTagIds=[], questProgress=[] }) {
  const canvasRef = useRef(null);
  const [imgUrl, setImgUrl] = useState(null);
  const [theme, setTheme] = useState("passport"); // passport | topo | retro

  const totalChecked = Object.values(checked).filter(Boolean).length;

  // Recent 4 visited parks by latest visit date (for 2×2 grid)
  const recentParks = useMemo(() => {
    const withDates = parks
      .filter(p => (visits[p.id]?.length ?? 0) > 0)
      .map(p => ({ park: p, latest: [...visits[p.id]].map(v=>v.date).sort().reverse()[0] }))
      .sort((a, b) => b.latest.localeCompare(a.latest));
    return withDates.slice(0, 4);
  }, [visits]);

  // Region-by-region stats
  const regionStats = useMemo(() => {
    return REGION_ORDER.map(key => {
      const total = parks.filter(p => p.region === key).length;
      const done  = parks.filter(p => p.region === key && checked[p.id]).length;
      const sample = parks.find(p => p.region === key);
      return { key, label: isJa ? sample.regionJa : key, done, total };
    });
  }, [checked, isJa]);

  // Longest trip streak (for streak badge on share card)
  const longestStreak = useMemo(() => computeTripStreaks(visits).longest, [visits]);

  // Earned badge icons (all badges + tag badges combined, capped for display)
  const earnedBadgeIcons = useMemo(() => {
    const fromBadges = BADGES.filter(b => earnedBadgeIds.includes(b.id)).map(b => b.icon);
    const fromTags   = TAG_BADGES.filter(b => earnedTagIds.includes(b.id)).map(b => b.icon);
    return [...fromBadges, ...fromTags];
  }, [earnedBadgeIds, earnedTagIds]);
  const totalBadgeCount = BADGES.length + TAG_BADGES.length;
  const completedQuestCount = questProgress.filter(q => q.complete).length;

  // Catchphrase pools, tiered by achievement level — random pick per generation
  const catchphrases = useMemo(() => {
    const n = totalChecked;
    let pool;
    if (n === 0) {
      pool = isJa
        ? ["まだ旅は始まっていない", "次の一歩を待っている", "白紙の地図、無限の可能性"]
        : ["The adventure awaits", "Blank map, endless possibility", "Not yet begun"];
    } else if (n < 5) {
      pool = isJa
        ? ["旅の始まり", "駆け出しの探検家", "最初の一歩を刻んだ", "小さな冒険家"]
        : ["Just getting started", "Rookie explorer", "First steps taken", "Trail beginner"];
    } else if (n < 15) {
      pool = isJa
        ? ["駆け出しのパークレンジャー", "冒険心に火がついた", "地図を塗り始めた旅人", "週末ワンダラー"]
        : ["Weekend Wanderer", "Trail Blazer in training", "Getting the itch", "Map filling in"];
    } else if (n < 30) {
      pool = isJa
        ? ["本格派アウトドア派", "国立公園ハンター", "自然に呼ばれる者", "旅の中盤戦"]
        : ["Seasoned Trailhead Hunter", "Park Chaser", "Called by the wild", "Halfway there"];
    } else if (n < 45) {
      pool = isJa
        ? ["ベテラン国立公園マスター", "地図の大半を制覇", "自然と共に生きる者", "本物の探検家"]
        : ["Park Veteran", "Nature's Regular", "Seasoned Adventurer", "Trail Master"];
    } else if (n < 63) {
      pool = isJa
        ? ["伝説のパークマスター", "残すはあと少し", "国立公園の生き字引", "頂点を目指す者"]
        : ["Legendary Park Master", "So close to it all", "Almost Everywhere", "Elite Explorer"];
    } else {
      pool = isJa
        ? ["全63公園制覇！殿堂入り", "アメリカ国立公園グランドマスター", "伝説となった旅人"]
        : ["ALL 63 PARKS — Hall of Fame", "National Parks Grand Master", "The Complete Journey"];
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }, [totalChecked, isJa]);

  // ── Shared helper: rounded rect ──
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return isJa
      ? `${d.getMonth()+1}/${d.getDate()}`
      : d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
  }

  // ── Shared: generation timestamp (small, bottom of card) ──
  const generatedAt = useMemo(() => new Date(), []);
  function drawTimestamp(ctx, cx, y, color, fontFamily) {
    const stamp = isJa
      ? `${tx.generatedOn}: ${generatedAt.getFullYear()}/${generatedAt.getMonth()+1}/${generatedAt.getDate()} ${String(generatedAt.getHours()).padStart(2,"0")}:${String(generatedAt.getMinutes()).padStart(2,"0")}`
      : `${tx.generatedOn}: ${generatedAt.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"})} ${String(generatedAt.getHours()).padStart(2,"0")}:${String(generatedAt.getMinutes()).padStart(2,"0")}`;
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.font = `16px ${fontFamily}`;
    ctx.fillText(stamp, cx, y);
  }

  // ══════════════════════════════════════════════════════
  // THEME 1: National Park Passport (deep green, elegant serif)
  // ══════════════════════════════════════════════════════
  function drawPassport(ctx, W, H) {
    const cx = W / 2;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#152816"); grad.addColorStop(1, "#0a1410");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    const rGrad = ctx.createRadialGradient(cx, H*0.1, 0, cx, H*0.1, H*0.6);
    rGrad.addColorStop(0, "rgba(90,150,90,0.18)"); rGrad.addColorStop(1, "rgba(90,150,90,0)");
    ctx.fillStyle = rGrad; ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#3a6a4a"; ctx.lineWidth = 3;
    ctx.strokeRect(24, 24, W-48, H-48);
    ctx.strokeStyle = "#2a4a3a"; ctx.lineWidth = 1;
    ctx.strokeRect(38, 38, W-76, H-76);

    ctx.textAlign = "center";
    ctx.fillStyle = "#7aae7a"; ctx.font = "500 24px Georgia, serif"; ctx.letterSpacing = "5px";
    ctx.fillText(isJa ? "アメリカ国立公園" : "U.S. NATIONAL PARKS", cx, 100);
    ctx.letterSpacing = "0px";

    ctx.fillStyle = "#e8f0e0"; ctx.font = "700 180px Georgia, serif";
    ctx.fillText(String(totalChecked), cx, 290);

    ctx.fillStyle = "#9ac89a"; ctx.font = "400 30px Georgia, serif";
    ctx.fillText(isJa ? `／ ${parks.length} 公園 訪問済み` : `of ${parks.length} parks visited`, cx, 332);

    drawPill(ctx, cx, 370, catchphrases, "#5a9a6a", "rgba(90,160,100,0.15)", "#c8e8c8", "italic 600 28px Georgia, serif");
    const streakOffset = drawStreakBadge(ctx, cx, 432, "#5a9a6a", "rgba(90,160,100,0.1)", "#8ad49a", "600 20px Georgia, serif");

    line(ctx, cx, 452 + streakOffset);
    ctx.fillStyle = "#6a9a6a"; ctx.font = "500 22px Georgia, serif";
    ctx.fillText(isJa ? "地域別 達成率" : "PROGRESS BY REGION", cx, 490 + streakOffset);

    drawRegionGrid(ctx, cx, 520 + streakOffset, "#a8c8a8", "#7aae7a", "#1a2e1a", "#5acc5a");

    const dividerY = 520 + streakOffset + Math.ceil(regionStats.length/2) * 56 + 14;
    line(ctx, cx, dividerY);
    ctx.fillStyle = "#6a9a6a"; ctx.font = "500 22px Georgia, serif";
    ctx.fillText(isJa ? "直近訪れた公園" : "RECENTLY VISITED", cx, dividerY + 36);

    drawRecentGrid(ctx, cx, dividerY + 60, "#1a2e18", "#2a4a2a", "#eef4e8", "#6a9a6a", false, "#5acc5a");

    const badgeShowcaseY = dividerY + 60 + 338 + 24;
    const showcaseResult = drawBadgeShowcase(ctx, cx, badgeShowcaseY, "#111e11", "#2a4a3a", "#8aaa8a", "#0a1a0a", "#5acc5a");
    const nameBadgeY = Math.max(H - 88, showcaseResult.nextY + 40);

    drawNameBadge(ctx, cx, nameBadgeY, "👤", "#0f1f0f", "#3a6a4a", "#a8d4a8", "Georgia, serif");
    drawTimestamp(ctx, cx, nameBadgeY + 72, "#3a5a4a", "Georgia, serif");

    function line(ctx, cx, y) {
      ctx.strokeStyle = "#3a6a4a"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx-200, y); ctx.lineTo(cx+200, y); ctx.stroke();
    }
    return Math.ceil(nameBadgeY + 72 + 50);
  }

  // ══════════════════════════════════════════════════════
  // THEME 2: Topographic Map (contour lines, outdoorsy)
  // ══════════════════════════════════════════════════════
  function drawTopo(ctx, W, H) {
    const cx = W / 2;
    ctx.fillStyle = "#0d1712"; ctx.fillRect(0, 0, W, H);

    // Contour line rings (decorative, radiating from top-center)
    ctx.strokeStyle = "rgba(120,160,120,0.10)"; ctx.lineWidth = 1.5;
    for (let r = 60; r < 1300; r += 55) {
      ctx.beginPath();
      ctx.ellipse(cx, 140, r, r*0.85, 0, 0, Math.PI*2);
      ctx.stroke();
    }
    // Grid overlay (map-like)
    ctx.strokeStyle = "rgba(120,160,120,0.06)"; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    ctx.strokeStyle = "#4a7a5a"; ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, W-40, H-40);
    // Corner ticks
    [[20,20],[W-20,20],[20,H-20],[W-20,H-20]].forEach(([x,y])=>{
      ctx.fillStyle = "#5a9a6a";
      ctx.fillRect(x-3,y-3,6,6);
    });

    ctx.textAlign = "center";
    ctx.fillStyle = "#6adc8a"; ctx.font = "600 22px 'Courier New', monospace"; ctx.letterSpacing = "6px";
    ctx.fillText(isJa ? "アメリカ国立公園 · 記録" : "U.S. NATIONAL PARKS · LOG", cx, 100);
    ctx.letterSpacing = "0px";

    // Elevation-style number
    ctx.fillStyle = "#eafbea"; ctx.font = "800 180px 'Courier New', monospace";
    ctx.fillText(String(totalChecked), cx, 290);
    ctx.fillStyle = "#5adc7a"; ctx.font = "600 26px 'Courier New', monospace";
    ctx.fillText(isJa ? `PARKS 訪問 / ${parks.length}` : `PARKS VISITED / ${parks.length}`, cx, 328);

    drawPill(ctx, cx, 368, catchphrases.toUpperCase(), "#4adc6a", "rgba(60,180,90,0.12)", "#8af0a0", "700 24px 'Courier New', monospace");
    const streakOffset = drawStreakBadge(ctx, cx, 430, "#3a8a4a", "rgba(60,180,90,0.08)", "#6adc8a", "600 18px 'Courier New', monospace");

    dashLine(cx, 448 + streakOffset);
    ctx.fillStyle = "#5adc7a"; ctx.font = "600 20px 'Courier New', monospace"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "地域別 達成率" : "PROGRESS BY REGION", cx, 486 + streakOffset);
    ctx.letterSpacing = "0px";

    drawRegionGrid(ctx, cx, 516 + streakOffset, "#c0e8c8", "#4adc6a", "#152a18", "#3adc5a");

    const dividerY = 516 + streakOffset + Math.ceil(regionStats.length/2) * 56 + 14;
    dashLine(cx, dividerY);
    ctx.fillStyle = "#5adc7a"; ctx.font = "600 20px 'Courier New', monospace"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "直近訪れた公園" : "RECENTLY VISITED", cx, dividerY + 36);
    ctx.letterSpacing = "0px";

    drawRecentGrid(ctx, cx, dividerY + 60, "#0f1f14", "#2a5a3a", "#eafbea", "#4adc6a", true, "#3adc5a");

    const badgeShowcaseY = dividerY + 60 + 338 + 24;
    const showcaseResult = drawBadgeShowcase(ctx, cx, badgeShowcaseY, "#0d1a10", "#2a5a3a", "#5adc7a", "#0a1510", "#4adc6a");
    const nameBadgeY = Math.max(H - 88, showcaseResult.nextY + 40);

    drawNameBadge(ctx, cx, nameBadgeY, "◉", "#0f1f14", "#3a7a4a", "#5adc7a", "'Courier New', monospace");
    drawTimestamp(ctx, cx, nameBadgeY + 72, "#2a5a3a", "'Courier New', monospace");

    function dashLine(cx, y) {
      ctx.strokeStyle = "#3a7a4a"; ctx.lineWidth = 1.5; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.moveTo(cx-200, y); ctx.lineTo(cx+200, y); ctx.stroke();
      ctx.setLineDash([]);
    }
    return Math.ceil(nameBadgeY + 72 + 50);
  }

  // ══════════════════════════════════════════════════════
  // THEME 3: Retro WPA Poster (warm mustard/brick, flat bold)
  // ══════════════════════════════════════════════════════
  function drawRetro(ctx, W, H) {
    const cx = W / 2;
    ctx.fillStyle = "#e8d5a8"; ctx.fillRect(0, 0, W, H);

    // Sun-ray burst behind number (retro poster motif)
    ctx.save();
    ctx.translate(cx, 240);
    for (let i = 0; i < 16; i++) {
      ctx.rotate(Math.PI / 8);
      ctx.fillStyle = i % 2 === 0 ? "rgba(196,90,50,0.10)" : "rgba(196,90,50,0.05)";
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.arc(0,0,560,0,Math.PI/8); ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // Thick border frame
    ctx.strokeStyle = "#8a3a2a"; ctx.lineWidth = 10;
    ctx.strokeRect(30, 30, W-60, H-60);
    ctx.strokeStyle = "#c8a04a"; ctx.lineWidth = 3;
    ctx.strokeRect(48, 48, W-96, H-96);

    // Decorative corner stars
    function star(cx, cy, size, color) {
      ctx.fillStyle = color;
      ctx.save(); ctx.translate(cx, cy);
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.rotate(Math.PI / 5);
        ctx.lineTo(0, size);
        ctx.rotate(Math.PI / 5);
        ctx.lineTo(0, size * 0.4);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    [[80,80],[W-80,80],[80,H-80],[W-80,H-80]].forEach(([x,y]) => star(x, y, 12, "#c8a04a"));

    ctx.textAlign = "center";
    ctx.fillStyle = "#8a3a2a"; ctx.font = "800 26px Georgia, serif"; ctx.letterSpacing = "6px";
    ctx.fillText(isJa ? "アメリカ国立公園" : "U.S. NATIONAL PARKS", cx, 105);
    ctx.letterSpacing = "0px";

    // Double underline accent below title
    ctx.strokeStyle = "#c8a04a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx-140, 122); ctx.lineTo(cx+140, 122); ctx.stroke();
    ctx.strokeStyle = "#8a3a2a"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx-100, 128); ctx.lineTo(cx+100, 128); ctx.stroke();

    ctx.fillStyle = "#8a3a2a"; ctx.font = "900 190px Georgia, serif";
    ctx.fillText(String(totalChecked), cx, 300);
    ctx.fillStyle = "#3a5a3a"; ctx.font = "700 30px Georgia, serif";
    ctx.fillText(isJa ? `／ ${parks.length} 公園 訪問済み` : `of ${parks.length} parks visited`, cx, 340);

    drawPill(ctx, cx, 378, catchphrases, "#8a3a2a", "rgba(138,58,42,0.12)", "#8a3a2a", "italic 700 28px Georgia, serif");
    const streakOffset = drawStreakBadge(ctx, cx, 440, "#8a3a2a", "rgba(196,90,50,0.1)", "#8a3a2a", "700 18px Georgia, serif");

    thickLine(cx, 458 + streakOffset);
    ctx.fillStyle = "#5a3a2a"; ctx.font = "700 22px Georgia, serif"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "地域別 達成率" : "PROGRESS BY REGION", cx, 496 + streakOffset);
    ctx.letterSpacing = "0px";

    drawRegionGrid(ctx, cx, 526 + streakOffset, "#5a3a2a", "#8a3a2a", "#d8c090", "#c85a30");

    const dividerY = 526 + streakOffset + Math.ceil(regionStats.length/2) * 56 + 14;
    thickLine(cx, dividerY);
    ctx.fillStyle = "#5a3a2a"; ctx.font = "700 22px Georgia, serif"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "直近訪れた公園" : "RECENTLY VISITED", cx, dividerY + 36);
    ctx.letterSpacing = "0px";

    drawRecentGrid(ctx, cx, dividerY + 60, "#dcc898", "#8a3a2a", "#4a2a1a", "#8a3a2a", false, "#c85a30");

    const badgeShowcaseY = dividerY + 60 + 338 + 24;
    const showcaseResult = drawBadgeShowcase(ctx, cx, badgeShowcaseY, "#e8d5a8", "#8a3a2a", "#5a3a2a", "#dcc898", "#c85a30");
    const nameBadgeY = Math.max(H - 88, showcaseResult.nextY + 40);

    drawNameBadge(ctx, cx, nameBadgeY, "★", "#dcc898", "#8a3a2a", "#8a3a2a", "Georgia, serif");
    drawTimestamp(ctx, cx, nameBadgeY + 72, "#7a5a3a", "Georgia, serif");

    function thickLine(cx, y) {
      ctx.strokeStyle = "#8a3a2a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx-200, y); ctx.lineTo(cx+200, y); ctx.stroke();
    }
    return Math.ceil(nameBadgeY + 72 + 50);
  }

  // ── Shared: catchphrase pill ──
  function drawPill(ctx, cx, y, text, borderColor, bgColor, textColor, font) {
    ctx.font = font;
    const w = ctx.measureText(text).width + 56, h = 50;
    const x = cx - w/2;
    ctx.fillStyle = bgColor; ctx.strokeStyle = borderColor; ctx.lineWidth = 1.5;
    roundRect(ctx, x, y, w, h, h/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.fillText(text, cx, y + h*0.66);
  }

  // ── Shared: streak badge (only rendered when a trip streak exists) ──
  function drawStreakBadge(ctx, cx, y, borderColor, bgColor, textColor, font) {
    if (!longestStreak || longestStreak.count < 2) return 0; // no badge, no extra space used
    const text = `🔥 ${tx.parksInOneTrip(longestStreak.count)}`;
    ctx.font = font;
    const w = ctx.measureText(text).width + 44, h = 38;
    const x = cx - w/2;
    ctx.fillStyle = bgColor; ctx.strokeStyle = borderColor; ctx.lineWidth = 1.2;
    roundRect(ctx, x, y, w, h, h/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.fillText(text, cx, y + h*0.66);
    return h + 14; // space consumed, so caller can shift subsequent content down
  }

  // ── Shared: badge showcase strip (earned badge icons + quest count) ──
  function drawBadgeShowcase(ctx, cx, y, cardBg, cardBorder, labelColor, iconBg, accentColor) {
    if (earnedBadgeIcons.length === 0 && completedQuestCount === 0) return { height: 0, nextY: y };

    const boxW = 980, headerH = 46;
    const maxIcons = 10;
    const iconsToShow = earnedBadgeIcons.slice(0, maxIcons);
    const extra = earnedBadgeIcons.length - iconsToShow.length;
    const chipSize = 76, chipGap = 16;
    const rowCount = Math.ceil((iconsToShow.length + (extra>0?1:0)) / 5);
    const iconRowsH = rowCount * (chipSize + 20);
    const boxH = headerH + iconRowsH + 24;

    const x = cx - boxW/2;
    // Card with subtle gradient fill
    const grad = ctx.createLinearGradient(x, y, x, y + boxH);
    grad.addColorStop(0, cardBg);
    grad.addColorStop(1, cardBg);
    ctx.fillStyle = grad; ctx.strokeStyle = accentColor; ctx.lineWidth = 2;
    roundRect(ctx, x, y, boxW, boxH, 16); ctx.fill(); ctx.stroke();

    // Header row with accent-colored labels
    ctx.textAlign = "left";
    ctx.font = "700 26px Georgia, serif";
    ctx.fillStyle = accentColor;
    const badgeLabel = isJa ? `🏅 バッジ ${earnedBadgeIcons.length}/${totalBadgeCount}` : `🏅 Badges ${earnedBadgeIcons.length}/${totalBadgeCount}`;
    ctx.fillText(badgeLabel, x + 28, y + 36);

    ctx.textAlign = "right";
    const questLabel = isJa ? `🗺 クエスト ${completedQuestCount}/${questProgress.length}` : `🗺 Quests ${completedQuestCount}/${questProgress.length}`;
    ctx.fillText(questLabel, x + boxW - 28, y + 36);

    // Icon grid: large glowing chips, 5 per row
    ctx.textAlign = "center";
    const perRow = 5;
    const rowW = perRow * chipSize + (perRow-1) * chipGap;
    let idx = 0;
    const allChips = [...iconsToShow.map(ic=>({icon:ic})), ...(extra>0?[{extra}]:[])];
    allChips.forEach((chip) => {
      const row = Math.floor(idx / perRow);
      const col = idx % perRow;
      const rowItems = Math.min(perRow, allChips.length - row*perRow);
      const rowStartX = cx - (rowItems*chipSize + (rowItems-1)*chipGap)/2 + chipSize/2;
      const chipX = rowStartX + col * (chipSize + chipGap);
      const chipY = y + headerH + 30 + row * (chipSize + 20) + chipSize/2;

      // Glow ring behind chip
      ctx.fillStyle = accentColor; ctx.globalAlpha = 0.18;
      ctx.beginPath(); ctx.arc(chipX, chipY, chipSize/2 + 6, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;

      // Chip circle
      ctx.fillStyle = iconBg; ctx.strokeStyle = accentColor; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(chipX, chipY, chipSize/2, 0, Math.PI*2); ctx.fill(); ctx.stroke();

      if (chip.extra) {
        ctx.font = "700 26px Georgia, serif";
        ctx.fillStyle = accentColor;
        ctx.fillText(`+${chip.extra}`, chipX, chipY + 9);
      } else {
        ctx.font = "42px sans-serif";
        ctx.fillStyle = "#000";
        ctx.fillText(chip.icon, chipX, chipY + 14);
      }
      idx++;
    });

    return { height: boxH, nextY: y + boxH };
  }

  // ── Shared: large profile-name badge (footer) ──
  function drawNameBadge(ctx, cx, y, icon, bgColor, borderColor, textColor, fontFamily) {
    ctx.textAlign = "center";
    ctx.font = `700 32px ${fontFamily}`;
    const text = `${icon}  ${profile.name}`;
    const w = ctx.measureText(text).width + 64, h = 60;
    const x = cx - w/2;
    ctx.fillStyle = bgColor; ctx.strokeStyle = borderColor; ctx.lineWidth = 2;
    roundRect(ctx, x, y, w, h, h/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.fillText(text, cx, y + h*0.66);
  }

  // ── Shared: region progress 2-col grid ──
  function drawRegionGrid(ctx, cx, startY, labelColor, valueColor, trackColor, fillColor) {
    const barAreaX = 90, barAreaW = 1080 - 180;
    const colGap = 16, colW = (barAreaW - colGap) / 2;
    regionStats.forEach((r, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const bx = barAreaX + col * (colW + colGap);
      const by = startY + row * 56;
      const pct = r.total > 0 ? r.done / r.total : 0;

      ctx.textAlign = "left";
      ctx.fillStyle = labelColor; ctx.font = "500 19px Georgia, serif";
      ctx.fillText(r.label, bx, by);
      ctx.textAlign = "right";
      ctx.fillStyle = valueColor; ctx.font = "500 17px Georgia, serif";
      ctx.fillText(`${r.done}/${r.total}`, bx + colW, by);

      const barY = by + 9, barH = 9;
      ctx.fillStyle = trackColor;
      roundRect(ctx, bx, barY, colW, barH, 4); ctx.fill();
      if (pct > 0) {
        ctx.fillStyle = fillColor;
        roundRect(ctx, bx, barY, colW * pct, barH, 4); ctx.fill();
      }
    });
    ctx.textAlign = "center";
  }

  // ── Shared: recent visits 2×2 grid ──
  function drawRecentGrid(ctx, cx, startY, cardBg, cardBorder, textColor, dateColor, mono, accentColor) {
    const gridW = 940, gridGap = 22;
    const cardW = (gridW - gridGap) / 2, cardH = 158;
    const startX = cx - gridW/2;
    const fontFamily = mono ? "'Courier New', monospace" : "Georgia, serif";
    const accent = accentColor || textColor;

    for (let i = 0; i < 4; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const x = startX + col * (cardW + gridGap);
      const y = startY + row * (cardH + gridGap);

      // Card background with subtle depth
      ctx.fillStyle = cardBg; ctx.strokeStyle = cardBorder; ctx.lineWidth = 1.5;
      roundRect(ctx, x, y, cardW, cardH, 12); ctx.fill(); ctx.stroke();

      // Decorative corner accent (top-left notch)
      ctx.fillStyle = accent; ctx.globalAlpha = 0.12;
      roundRect(ctx, x, y, cardW, 5, 2); ctx.fill();
      ctx.globalAlpha = 1;

      const entry = recentParks[i];
      ctx.textAlign = "center";
      if (entry) {
        const name = isJa ? entry.park.ja : entry.park.name;
        // Emoji circle badge
        ctx.fillStyle = accent; ctx.globalAlpha = 0.13;
        ctx.beginPath(); ctx.arc(x + cardW/2, y + 44, 30, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = textColor; ctx.font = `38px ${fontFamily}`;
        ctx.fillText(entry.park.emoji, x + cardW/2, y + 56);

        // Park name — bigger, bolder
        let displayName = name;
        ctx.font = `700 28px ${fontFamily}`;
        while (ctx.measureText(displayName).width > cardW - 28 && displayName.length > 3) {
          displayName = displayName.slice(0, -2) + "…";
        }
        ctx.fillStyle = textColor;
        ctx.fillText(displayName, x + cardW/2, y + 104);

        // Date pill
        ctx.font = `600 20px ${fontFamily}`;
        const dateText = fmtDate(entry.latest);
        const dw = ctx.measureText(dateText).width + 24;
        ctx.fillStyle = accent; ctx.globalAlpha = 0.15;
        roundRect(ctx, x + cardW/2 - dw/2, y + 122, dw, 28, 14); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = dateColor;
        ctx.fillText(dateText, x + cardW/2, y + 141);
      } else {
        ctx.fillStyle = dateColor; ctx.font = `italic 20px ${fontFamily}`;
        ctx.globalAlpha = 0.5;
        ctx.fillText("—", x + cardW/2, y + cardH/2 + 6);
        ctx.globalAlpha = 1;
      }
    }
  }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const W = 1080, H = 1950; // tall enough for 2x2 grid + stats + streak + full badge showcase (up to 4 rows) + name badge + timestamp, all dynamically positioned
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");

    if (theme === "passport") drawPassport(ctx, W, H);
    else if (theme === "topo") drawTopo(ctx, W, H);
    else drawRetro(ctx, W, H);

    setImgUrl(canvas.toDataURL("image/png"));
  }, [theme, totalChecked, recentParks, regionStats, catchphrases, isJa, profile.name]);

  const handleDownload = () => {
    if (!imgUrl) return;
    const a = document.createElement("a");
    a.href = imgUrl;
    a.download = `national-parks-${profile.name}-${theme}-${today()}.png`;
    a.click();
  };

  const handleShare = async () => {
    if (!imgUrl || typeof navigator==="undefined" || !navigator.share) { handleDownload(); return; }
    try {
      const blob = await (await fetch(imgUrl)).blob();
      const file = new File([blob], "national-parks.png", { type: "image/png" });
      await navigator.share({ files: [file], title: isJa ? "国立公園チェックリスト" : "National Parks Checklist" });
    } catch { handleDownload(); }
  };

  const themeLabels = {
    passport: isJa ? "🏔 パスポート" : "🏔 Passport",
    topo:     isJa ? "🗺 地形図" : "🗺 Topo Map",
    retro:    isJa ? "🎨 レトロ" : "🎨 Retro",
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2500,padding:16,overflowY:"auto"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#0d150d",border:"1px solid #2a4a2a",borderRadius:16,padding:16,maxWidth:420,width:"100%",margin:"auto"}}>

        {/* Theme selector */}
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          {Object.entries(themeLabels).map(([key,label]) => (
            <button key={key} onClick={()=>setTheme(key)} style={{
              flex:1, padding:"7px 4px", borderRadius:8, fontSize:11, cursor:"pointer", fontFamily:"inherit",
              background: theme===key?"#2a5a2a":"transparent",
              border:`1px solid ${theme===key?"#5a9a5a":"#2a3a2a"}`,
              color: theme===key?"#a8d4a8":"#6a8a6a",
            }}>{label}</button>
          ))}
        </div>

        <canvas ref={canvasRef} style={{width:"100%",borderRadius:10,display:"block"}} />
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button onClick={handleShare} style={{flex:1,padding:"12px",background:"#2a5a2a",border:"1px solid #4a8a4a",borderRadius:8,color:"#a8d4a8",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
            {(typeof navigator!=="undefined"&&navigator.share) ? (isJa?"📤 共有":"📤 Share") : (isJa?"⬇ 保存":"⬇ Save")}
          </button>
          <button onClick={onClose} style={{padding:"12px 20px",background:"transparent",border:"1px solid #2a3a2a",borderRadius:8,color:"#6a8a6a",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
            {tx.cancel}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Helpers ───────────────────────────────────────────────────────
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}
// Normalize a visits object so every entry is {date, note} — migrates old string[] format
function migrateVisits(visits) {
  const out = {};
  Object.entries(visits || {}).forEach(([pid, arr]) => {
    out[pid] = (arr || []).map(v => typeof v === "string" ? { date: v, note: "" } : v);
  });
  return out;
}
function initStore() {
  const existing = loadData();
  if (existing?.profiles) {
    return { ...existing, profiles: existing.profiles.map(p => ({ ...p, visits: migrateVisits(p.visits) })) };
  }
  // Migrate old single-profile data (pre-profiles version)
  const oldKey = "np_checklist_v1";
  let oldVisits = {};
  try { const r = localStorage.getItem(oldKey); if (r) oldVisits = JSON.parse(r); } catch {}
  const id = uid();
  return { activeId: id, profiles: [{ id, name: "Me", visits: migrateVisits(oldVisits) }] };
}

// ── Backup: export/import ──
function exportStoreToFile(store) {
  const payload = { app: "national-parks-checklist", version: 1, exportedAt: new Date().toISOString(), data: store };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `national-parks-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function parseImportedFile(text) {
  const parsed = JSON.parse(text);
  const data = parsed?.data ?? parsed; // tolerate raw store or wrapped payload
  if (!data?.profiles || !Array.isArray(data.profiles)) throw new Error("invalid shape");
  return { ...data, profiles: data.profiles.map(p => ({ ...p, visits: migrateVisits(p.visits) })) };
}

// ── Main App ──────────────────────────────────────────────────────
function App() {
  const [store,         setStore]         = useState(() => initStore());
  const [lang,          setLang]          = useState(() => { try { return localStorage.getItem(LANG_KEY)||"en"; } catch { return "en"; } });
  const [siteTheme,     setSiteTheme]     = useState(() => { try { return localStorage.getItem(THEME_KEY)||"passport"; } catch { return "passport"; } });
  const [tab,           setTab]           = useState("list");
  const [activeRegion,  setActiveRegion]  = useState("all");
  const [search,        setSearch]        = useState("");
  const [sortMode,      setSortMode]      = useState("az"); // az | dateDesc | dateAsc | unvisited
  const [showSortMenu,  setShowSortMenu]  = useState(false);
  const [showBadges,    setShowBadges]    = useState(false);
  const [selectedPark,  setSelectedPark]  = useState(null);
  const [dateModalPark, setDateModalPark] = useState(null);
  const [hoveredMapId,  setHoveredMapId]  = useState(null);
  const [showProfiles,  setShowProfiles]  = useState(false);
  const [showShareCard, setShowShareCard] = useState(false);
  const [showThemePicker, setShowThemePicker] = useState(false);
  const [confirm,       setConfirm]       = useState(null); // { message, onConfirm }
  const parkRefs = useRef({});

  const isJa = lang === "ja";
  const tx   = i18n[lang];
  const T    = THEMES[siteTheme];

  useEffect(() => { try { localStorage.setItem(THEME_KEY, siteTheme); } catch {} }, [siteTheme]);

  // Persist
  useEffect(() => { saveData(store); }, [store]);
  useEffect(() => { try { localStorage.setItem(LANG_KEY, lang); } catch {} }, [lang]);

  const activeProfile = store.profiles.find(p=>p.id===store.activeId) || store.profiles[0];
  const visits = activeProfile.visits;

  const setVisits = (updater) => {
    setStore(prev => {
      const newVisits = typeof updater === "function" ? updater(activeProfile.visits) : updater;
      return {
        ...prev,
        profiles: prev.profiles.map(p => p.id===prev.activeId ? {...p, visits:newVisits} : p),
      };
    });
  };

  const checked = useMemo(() => {
    const o={};
    parks.forEach(p=>{o[p.id]=(visits[p.id]?.length??0)>0;});
    return o;
  }, [visits]);

  const totalChecked = Object.values(checked).filter(Boolean).length;
  const progress     = Math.round((totalChecked/parks.length)*100);

  const earnedBadges = useMemo(() => computeEarnedBadges(visits, checked), [visits, checked]);
  const earnedTagBadges = useMemo(() => computeTagBadges(visits), [visits]);
  const questProgress = useMemo(() => computeQuestProgress(checked), [checked]);

  const regions = useMemo(()=>REGION_ORDER.map(key=>{
    const s=parks.find(p=>p.region===key);
    return {key, label:isJa?s.regionJa:key};
  }),[isJa]);

  const filteredParks = useMemo(()=>{
    const q=search.toLowerCase();
    const getLatestDate = (id) => {
      const arr = visits[id];
      if (!arr || arr.length === 0) return null;
      return [...arr].sort((a,b)=>b.date.localeCompare(a.date))[0].date;
    };
    return parks.filter(p=>{
      const matchRegion=activeRegion==="all"||p.region===activeRegion;
      const matchSearch=!search||p.name.toLowerCase().includes(q)||p.ja.includes(search)||p.state.toLowerCase().includes(q)||p.stateJa.includes(search);
      return matchRegion&&matchSearch;
    }).sort((a,b)=>{
      if (sortMode === "az") return a.name.localeCompare(b.name,"en",{sensitivity:"base"});
      if (sortMode === "dateDesc") {
        const da = getLatestDate(a.id), db = getLatestDate(b.id);
        if (!da && !db) return a.name.localeCompare(b.name,"en",{sensitivity:"base"});
        if (!da) return 1; if (!db) return -1;
        return db.localeCompare(da);
      }
      if (sortMode === "dateAsc") {
        const da = getLatestDate(a.id), db = getLatestDate(b.id);
        if (!da && !db) return a.name.localeCompare(b.name,"en",{sensitivity:"base"});
        if (!da) return 1; if (!db) return -1;
        return da.localeCompare(db);
      }
      if (sortMode === "unvisited") {
        const ca = checked[a.id]?1:0, cb = checked[b.id]?1:0;
        if (ca !== cb) return ca - cb;
        return a.name.localeCompare(b.name,"en",{sensitivity:"base"});
      }
      return 0;
    });
  },[activeRegion,search,sortMode,visits,checked]);

  const regionCount=(key)=>parks.filter(p=>p.region===key&&checked[p.id]).length;

  const addVisit=(id,date,note="")=>setVisits(prev=>{
    const ex=prev[id]??[];
    if(ex.some(v=>v.date===date)) return prev;
    return {...prev,[id]:[...ex,{date,note}]};
  });
  const removeVisit=(id,date)=>setVisits(prev=>({...prev,[id]:(prev[id]??[]).filter(v=>v.date!==date)}));
  const updateVisitNote=(id,date,note)=>setVisits(prev=>({...prev,[id]:(prev[id]??[]).map(v=>v.date===date?{...v,note}:v)}));

  const toggleCheck=(park)=>{
    if(!checked[park.id]){
      addVisit(park.id,today());
      setDateModalPark(park);
    } else {
      const visitCount = visits[park.id]?.length ?? 0;
      const parkName = isJa ? park.ja : park.name;
      setConfirm({
        message: tx.confirmUncheck(visitCount, parkName),
        onConfirm: () => {
          setVisits(prev=>({...prev,[park.id]:[]}));
          setConfirm(null);
        },
      });
    }
  };

  const resetAll=()=>{
    setConfirm({
      message: `${tx.confirmReset} "${activeProfile.name}"?`,
      onConfirm: ()=>{ setVisits({}); setConfirm(null); },
    });
  };

  const scrollToPark=(id)=>{
    setTab("list");setActiveRegion("all");setSearch("");
    setTimeout(()=>parkRefs.current[id]?.scrollIntoView({behavior:"smooth",block:"center"}),100);
  };

  // Profile actions
  const createProfile=(name)=>{
    const id=uid();
    setStore(prev=>({...prev, profiles:[...prev.profiles,{id,name,visits:{}}], activeId:id}));
  };
  const switchProfile=(id)=>setStore(prev=>({...prev,activeId:id}));
  const renameProfile=(id,name)=>setStore(prev=>({...prev,profiles:prev.profiles.map(p=>p.id===id?{...p,name}:p)}));
  const deleteProfile=(id)=>{
    const prof=store.profiles.find(p=>p.id===id);
    setConfirm({
      message:`${tx.confirmDelete} "${prof?.name}"?`,
      onConfirm:()=>{
        setStore(prev=>{
          const newProfiles=prev.profiles.filter(p=>p.id!==id);
          const newActive=prev.activeId===id?newProfiles[0].id:prev.activeId;
          return {...prev,profiles:newProfiles,activeId:newActive};
        });
        setConfirm(null);
      },
    });
  };

  // Backup: export/import handlers
  const handleExport = () => exportStoreToFile(store);
  const handleImport = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = parseImportedFile(reader.result);
        setConfirm({
          message: tx.importConfirm,
          onConfirm: () => {
            setStore(imported);
            setConfirm(null);
            setShowProfiles(false);
          },
        });
      } catch {
        setConfirm({ message: tx.importError, onConfirm: () => setConfirm(null) });
      }
    };
    reader.readAsText(file);
  };

  const S={
    btn:(active)=>({padding:"5px 20px",borderRadius:20,fontSize:12,cursor:"pointer",fontFamily:"inherit",background:active?T.btnBgActive:"transparent",border:`1px solid ${active?T.btnBorderActive:T.cardBorder}`,color:active?T.accentText:T.mutedText,transition:"all .2s"}),
    chip:(active)=>({padding:"4px 11px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit",background:active?T.chipBgActive:"transparent",border:`1px solid ${active?T.chipBorderActive:T.cardBorder}`,color:active?T.chipTextActive:T.chipText}),
    link:(color,bg,border)=>({flex:1,padding:"7px 0",textAlign:"center",borderRadius:8,fontSize:10,background:bg,border:`1px solid ${border}`,color,textDecoration:"none",display:"block"}),
    rowBtn:(color)=>({flex:1,padding:"7px 0",fontSize:10,cursor:"pointer",color,background:"transparent",border:"none",borderLeft:`1px solid ${T.cardBorder}`,fontFamily:"inherit"}),
  };

  return (
    <div style={{minHeight:"100vh",background:T.bg,fontFamily:isJa?"'Hiragino Sans','Noto Sans JP',sans-serif":T.fontBody,color:T.textPrimary,display:"flex",flexDirection:"column",transition:"background .3s ease"}}>

      {/* ── HEADER ── */}
      <div style={{background:T.headerBg,borderBottom:`1px solid ${T.headerBorder}`,padding:"28px 20px 20px",textAlign:"center",position:"relative"}}>
        <div style={{position:"absolute",inset:0,backgroundImage:`radial-gradient(ellipse at 50% 0%,${T.chipBgActive}33,transparent 70%)`,pointerEvents:"none"}}/>

        {/* Top-right buttons */}
        <div style={{position:"absolute",top:14,right:14,left:14,display:"flex",justifyContent:"flex-end",flexWrap:"wrap",gap:6,zIndex:1}}>
          <button onClick={()=>setShowThemePicker(true)}
            style={{padding:"4px 10px",background:"transparent",border:`1px solid ${T.headerBorder}`,borderRadius:20,color:T.mutedText,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            {T.label}
          </button>
          <button onClick={()=>setLang(l=>l==="en"?"ja":"en")}
            style={{padding:"4px 10px",background:"transparent",border:`1px solid ${T.headerBorder}`,borderRadius:20,color:T.mutedText,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            {tx.langBtn}
          </button>
          <button onClick={()=>setShowBadges(true)}
            style={{padding:"4px 10px",background:"transparent",border:`1px solid ${T.headerBorder}`,borderRadius:20,color:T.mutedText,fontSize:11,cursor:"pointer",fontFamily:"inherit",position:"relative"}}>
            🏅 {earnedBadges.length + earnedTagBadges.length}
          </button>
          <button onClick={()=>setShowProfiles(true)}
            style={{padding:"4px 10px",background:"transparent",border:`1px solid ${T.headerBorder}`,borderRadius:20,color:T.mutedText,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            👤
          </button>
        </div>

        <div style={{fontSize:11,letterSpacing:"0.3em",color:T.mutedText,textTransform:"uppercase",marginBottom:4,marginTop:36}}>{tx.country}</div>
        <h1 style={{margin:0,fontSize:"clamp(18px,4vw,28px)",fontWeight:400,color:T.textPrimary,lineHeight:1.2}}>{tx.title}</h1>
        <div style={{fontSize:11,color:T.textSecondary,marginTop:2}}>{tx.subtitle}</div>

        {/* Active profile name */}

          <button style={S.btn(tab==="stats")} onClick={()=>setTab("stats")}>{tx.statsTab}</button>
        </div>

        {/* Share + Reset */}
        {totalChecked>0&&(
          <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:6,marginTop:8}}>
            <button onClick={()=>setShowShareCard(true)}
              style={{padding:"5px 14px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit",background:"transparent",border:`1px solid ${T.cardBorderActive}`,color:T.accentText}}>
              📤 {isJa?"シェア":"Share"}
            </button>
            <button onClick={resetAll}
              style={{padding:"5px 14px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit",background:"transparent",border:"1px solid #8a4a3a",color:"#c07a5a"}}>
              🗑 {tx.resetAll}
            </button>
