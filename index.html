  <script>
    // ── PWA: inline manifest (data URI) ──
    const manifest = {
      name: "US National Parks Checklist",
      short_name: "NatParks",
      start_url: ".",
      display: "standalone",
      background_color: "#0a0f0a",
      theme_color: "#1a2e1a",
      icons: [
        { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a2e1a'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%F0%9F%8F%9C%EF%B8%8F%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    document.getElementById("manifest-link").href = URL.createObjectURL(manifestBlob);

    // ── PWA: Service Worker for offline caching (inline via Blob) ──
    if ("serviceWorker" in navigator) {
      const swCode = `
        const CACHE_NAME = "natparks-v1";
        self.addEventListener("install", (e) => {
          self.skipWaiting();
        });
        self.addEventListener("activate", (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener("fetch", (e) => {
          if (e.request.method !== "GET") return;
          e.respondWith(
            caches.open(CACHE_NAME).then((cache) =>
              cache.match(e.request).then((cached) => {
                const fetchPromise = fetch(e.request).then((networkResponse) => {
                  if (networkResponse && networkResponse.status === 200) {
                    cache.put(e.request, networkResponse.clone());
                  }
                  return networkResponse;
                }).catch(() => cached);
                return cached || fetchPromise;
              })
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(swBlob);
      window.addEventListener("load", () => {
        navigator.serviceWorker.register(swUrl).catch(() => {});
      });
    }

    // ── Offline banner ──
    function updateOnlineStatus() {
      const banner = document.getElementById("offline-banner");
      if (navigator.onLine) banner.classList.remove("show");
      else banner.classList.add("show");
    }
    window.addEventListener("online", updateOnlineStatus);
    window.addEventListener("offline", updateOnlineStatus);
    updateOnlineStatus();

    // ── Install prompt (Android/Chrome) ──
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Only show if not already installed and not dismissed this session
      if (!sessionStorage.getItem("installDismissed") && !window.matchMedia("(display-mode: standalone)").matches) {
        document.getElementById("install-prompt").classList.add("show");
      }
    });
    document.getElementById("install-btn").addEventListener("click", async () => {
      document.getElementById("install-prompt").classList.remove("show");
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });
    document.getElementById("dismiss-btn").addEventListener("click", () => {
      document.getElementById("install-prompt").classList.remove("show");
      sessionStorage.setItem("installDismissed", "1");
    });
  </script>

// ── SVG Map (simple linear lat/lng projection — no distortion) ────
const MAP_W = 800, MAP_H = 500;
const MAP_BOUNDS = { minLng:-125, maxLng:-66, minLat:24, maxLat:50 };

function project(lat, lng) {
  const x = (lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng) * MAP_W;
  const y = (MAP_BOUNDS.maxLat - lat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat) * MAP_H;
  return { x, y };
}

function SVGMap({ parks, checked, visits, isJa, onParkClick, hoveredId, setHoveredId, themeColors }) {
  const contiguous = parks.filter(p=>!["Alaska","Hawaii","American Samoa","U.S. Virgin Islands"].includes(p.state));
  const outside    = parks.filter(p=> ["Alaska","Hawaii","American Samoa","U.S. Virgin Islands"].includes(p.state));

  const [zoom, setZoom]   = useState(1);
  const [pan,  setPan]    = useState({x:0,y:0});
  const dragRef = useRef({dragging:false, startX:0, startY:0, panX:0, panY:0});
  const pinchRef = useRef({active:false, startDist:0, startZoom:1});
  const svgRef = useRef(null);

  const MIN_ZOOM = 1, MAX_ZOOM = 6;

  const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

  const zoomBy = (factor, cx=MAP_W/2, cy=MAP_H/2) => {
    setZoom(prevZoom => {
      const newZoom = clamp(prevZoom * factor, MIN_ZOOM, MAX_ZOOM);
      setPan(prevPan => {
        // Zoom toward the given center point (keeps that point stable)
        const scaleDelta = newZoom / prevZoom;
        const nx = cx - (cx - prevPan.x) * scaleDelta;
        const ny = cy - (cy - prevPan.y) * scaleDelta;
        return clampPan(nx, ny, newZoom);
      });
      return newZoom;
    });
  };

  const clampPan = (x, y, z) => {
    const maxPanX = (MAP_W * z - MAP_W) ;
    const maxPanY = (MAP_H * z - MAP_H) ;
    return { x: clamp(x, -maxPanX, 0), y: clamp(y, -maxPanY, 0) };
  };

  const resetView = () => { setZoom(1); setPan({x:0,y:0}); };

  // Mouse drag pan
  const onPointerDown = (e) => {
    const p = e.touches ? e.touches[0] : e;
    dragRef.current = { dragging:true, startX:p.clientX, startY:p.clientY, panX:pan.x, panY:pan.y };
  };
  const onPointerMove = (e) => {
    if (e.touches && e.touches.length === 2) { handlePinch(e); return; }
    if (!dragRef.current.dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = MAP_W / rect.width, scaleY = MAP_H / rect.height;
    const dx = (p.clientX - dragRef.current.startX) * scaleX;
    const dy = (p.clientY - dragRef.current.startY) * scaleY;
    setPan(clampPan(dragRef.current.panX + dx, dragRef.current.panY + dy, zoom));
  };
  const onPointerUp = () => { dragRef.current.dragging = false; pinchRef.current.active = false; };

  // Touch pinch-to-zoom
  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      const dist = touchDist(e.touches);
      pinchRef.current = { active:true, startDist:dist, startZoom:zoom };
    } else if (e.touches.length === 1) {
      onPointerDown(e);
    }
  };
  const touchDist = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  };
  const handlePinch = (e) => {
    if (!pinchRef.current.active) return;
    const dist = touchDist(e.touches);
    const scale = dist / pinchRef.current.startDist;
    const newZoom = clamp(pinchRef.current.startZoom * scale, MIN_ZOOM, MAX_ZOOM);
    setZoom(newZoom);
    setPan(p => clampPan(p.x, p.y, newZoom));
  };

  // Wheel zoom (desktop)
  const onWheel = (e) => {
    e.preventDefault();
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = MAP_W / rect.width, scaleY = MAP_H / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;
    zoomBy(e.deltaY < 0 ? 1.2 : 1/1.2, cx, cy);
  };

  const viewBoxStr = `${-pan.x/zoom} ${-pan.y/zoom} ${MAP_W/zoom} ${MAP_H/zoom}`;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8,padding:"0 12px 8px"}}>
      <div style={{position:"relative"}}>
        <svg ref={svgRef} viewBox={viewBoxStr}
          style={{width:"100%",background:themeColors.mapBg,borderRadius:10,border:`1px solid ${themeColors.mapBorder}`,display:"block",touchAction:"none",cursor:dragRef.current.dragging?"grabbing":"grab"}}
          onMouseDown={onPointerDown} onMouseMove={onPointerMove} onMouseUp={onPointerUp} onMouseLeave={onPointerUp}
          onTouchStart={onTouchStart} onTouchMove={onPointerMove} onTouchEnd={onPointerUp}
          onWheel={onWheel}>
          {/* Land mass */}
          <path d={US_OUTLINE} fill={themeColors.mapLand} stroke={themeColors.mapLandBorder} strokeWidth={1.5/zoom} strokeLinejoin="round"/>
          {/* Reference grid */}
          {[0,1,2,3,4,5,6,7].map(i=><line key={`v${i}`} x1={i*100} y1="0" x2={i*100} y2={MAP_H} stroke={themeColors.mapGrid} strokeWidth={0.5/zoom}/>)}
          {[0,1,2,3,4,5].map(i=><line key={`h${i}`} x1="0" y1={i*100} x2={MAP_W} y2={i*100} stroke={themeColors.mapGrid} strokeWidth={0.5/zoom}/>)}
          {/* State abbreviation labels */}
          {STATE_LABELS.map(s=>(
            <text key={s.ab} x={s.x} y={s.y} fontSize={7/zoom} fill={themeColors.mapStateLabel} textAnchor="middle" style={{userSelect:"none",pointerEvents:"none"}}>{s.ab}</text>
          ))}

          {contiguous.map(park=>{
            const {x,y}=project(park.lat,park.lng);
            if(x<0||x>MAP_W||y<0||y>MAP_H) return null;
            const isChk=checked[park.id], cnt=visits[park.id]?.length??0, isHov=hoveredId===park.id;
            const r=(isHov?9:6.5)/Math.sqrt(zoom); // pins shrink slightly on zoom so map doesn't get cluttered, but stay tappable
            return (
              <g key={park.id} style={{cursor:"pointer"}} onClick={()=>onParkClick(park)}
                onMouseEnter={()=>setHoveredId(park.id)} onMouseLeave={()=>setHoveredId(null)}>
                {/* Outer ring: unmistakable visited/unvisited signal */}
                <circle cx={x} cy={y} r={r+2.5/Math.sqrt(zoom)} fill="none" stroke={isChk?themeColors.pinVisitedRing:"none"} strokeWidth={1.5/Math.sqrt(zoom)} opacity={isChk?0.6:0}/>
                <circle cx={x+0.8} cy={y+0.8} r={r} fill="rgba(0,0,0,0.5)"/>
                <circle cx={x} cy={y} r={r} fill={isChk?themeColors.pinVisited:themeColors.pinUnvisited} stroke={isChk?themeColors.pinVisitedBorder:themeColors.pinUnvisitedBorder} strokeWidth={1.5/Math.sqrt(zoom)}/>
                {isChk
                  ? <text x={x} y={y+r*0.35} fontSize={r*1.1} textAnchor="middle" fill={themeColors.pinCheckmark} style={{userSelect:"none",pointerEvents:"none",fontWeight:"bold"}}>✓</text>
                  : <circle cx={x} cy={y} r={r*0.3} fill={themeColors.pinUnvisitedDot}/>
                }
                {cnt>1&&<text x={x+r+2/Math.sqrt(zoom)} y={y-r+2/Math.sqrt(zoom)} fontSize={8/Math.sqrt(zoom)} fill={themeColors.pinBadge} fontWeight="bold" textAnchor="middle" style={{userSelect:"none"}}>{cnt}</text>}
              </g>
            );
          })}
        </svg>

        {/* Zoom controls */}
        <div style={{position:"absolute",top:8,right:8,display:"flex",flexDirection:"column",gap:4}}>
          <button onClick={()=>zoomBy(1.4)} style={{width:28,height:28,borderRadius:6,background:"rgba(10,20,10,0.85)",border:`1px solid ${themeColors.mapBorder}`,color:themeColors.mapStateLabel,fontSize:16,cursor:"pointer",lineHeight:1}}>+</button>
          <button onClick={()=>zoomBy(1/1.4)} style={{width:28,height:28,borderRadius:6,background:"rgba(10,20,10,0.85)",border:`1px solid ${themeColors.mapBorder}`,color:themeColors.mapStateLabel,fontSize:16,cursor:"pointer",lineHeight:1}}>−</button>
          {zoom>1&&<button onClick={resetView} style={{width:28,height:28,borderRadius:6,background:"rgba(10,20,10,0.85)",border:`1px solid ${themeColors.mapBorder}`,color:themeColors.mapStateLabel,fontSize:11,cursor:"pointer",lineHeight:1}}>⟲</button>}
        </div>
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:14,justifyContent:"center",fontSize:10,color:themeColors.mapStateLabel}}>
        <span style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:themeColors.pinVisited,border:`1px solid ${themeColors.pinVisitedBorder}`,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:7,color:themeColors.pinCheckmark}}>✓</span>
          {isJa?"訪問済み":"Visited"}
        </span>
        <span style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:themeColors.pinUnvisited,border:`1px solid ${themeColors.pinUnvisitedBorder}`,display:"inline-block"}}/>
          {isJa?"未訪問":"Not yet"}
        </span>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {[{label:"Alaska",fn:p=>p.state==="Alaska"},{label:"Hawaii",fn:p=>p.state==="Hawaii"},{label:"Territories",fn:p=>["American Samoa","U.S. Virgin Islands"].includes(p.state)}].map(({label,fn})=>{
          const sub=outside.filter(fn); if(!sub.length) return null;
          return (
            <div key={label} style={{background:themeColors.cardBg,border:`1px solid ${themeColors.cardBorder}`,borderRadius:8,padding:"8px 12px",flex:1,minWidth:90}}>
              <div style={{fontSize:10,color:themeColors.mapStateLabel,marginBottom:5,fontWeight:500}}>{label}</div>
              {sub.map(park=>{
                const cnt=visits[park.id]?.length??0;
                return (
                  <div key={park.id} onClick={()=>onParkClick(park)} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",cursor:"pointer"}}>
                    <div style={{width:8,height:8,borderRadius:"50%",flexShrink:0,background:checked[park.id]?themeColors.pinVisited:themeColors.pinUnvisited,border:`1.5px solid ${checked[park.id]?themeColors.pinVisitedBorder:themeColors.pinUnvisitedBorder}`}}/>
                    <span style={{fontSize:10,color:checked[park.id]?themeColors.accentText:themeColors.mutedText}}>{park.emoji} {isJa?park.ja:park.name}</span>
                    {cnt>1&&<span style={{fontSize:9,color:themeColors.accentText}}>×{cnt}</span>}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Timeline View (chronological visit history) ────────────────────
function TimelineView({ parks, visits, isJa, themeColors, onParkClick }) {
  const T = themeColors;

  // Flatten all visits across all parks into one sorted list
  const timeline = useMemo(() => {
    const entries = [];
    parks.forEach(park => {
      (visits[park.id] || []).forEach(v => {
        entries.push({ park, date: v.date, note: v.note });
      });
    });
    return entries.sort((a, b) => b.date.localeCompare(a.date));
  }, [parks, visits]);

  // Group by year
  const byYear = useMemo(() => {
    const groups = {};
    timeline.forEach(entry => {
      const year = entry.date.slice(0, 4);
      if (!groups[year]) groups[year] = [];
      groups[year].push(entry);
    });
    return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
  }, [timeline]);

  function fmtFull(iso) {
    const d = new Date(iso + "T12:00:00");
    return isJa
      ? `${d.getMonth()+1}月${d.getDate()}日`
      : d.toLocaleDateString("en-US", { month:"long", day:"numeric" });
  }

  if (timeline.length === 0) {
    return (
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:40,color:T.mutedText,fontSize:14,textAlign:"center"}}>
        {isJa ? "まだ訪問記録がありません。\nチェックを入れて旅の記録を始めましょう。" : "No visits logged yet.\nCheck off a park to start your journey timeline."}
      </div>
    );
  }

  return (
    <div style={{flex:1,padding:"16px 20px 80px",maxWidth:600,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      {byYear.map(([year, entries]) => (
        <div key={year} style={{marginBottom:28}}>
          <div style={{fontSize:20,color:T.accentText,fontWeight:600,marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
            <span>{year}</span>

// ── Share Card (Canvas-generated shareable image) ──────────────────
function ShareCardModal({ profile, visits, checked, isJa, tx, onClose }) {
  const canvasRef = useRef(null);
  const [imgUrl, setImgUrl] = useState(null);
  const [theme, setTheme] = useState("passport"); // passport | topo | retro

  const totalChecked = Object.values(checked).filter(Boolean).length;

  // Recent 4 visited parks by latest visit date (for 2×2 grid)
  const recentParks = useMemo(() => {
    const withDates = parks
      .filter(p => (visits[p.id]?.length ?? 0) > 0)
      .map(p => ({ park: p, latest: [...visits[p.id]].map(v=>v.date).sort().reverse()[0] }))
      .sort((a, b) => b.latest.localeCompare(a.latest));
    return withDates.slice(0, 4);
  }, [visits]);

  // Region-by-region stats
  const regionStats = useMemo(() => {
    return REGION_ORDER.map(key => {
      const total = parks.filter(p => p.region === key).length;
      const done  = parks.filter(p => p.region === key && checked[p.id]).length;
      const sample = parks.find(p => p.region === key);
      return { key, label: isJa ? sample.regionJa : key, done, total };
    });
  }, [checked, isJa]);

  // Catchphrase pools, tiered by achievement level — random pick per generation
  const catchphrases = useMemo(() => {
    const n = totalChecked;
    let pool;
    if (n === 0) {
      pool = isJa
        ? ["まだ旅は始まっていない", "次の一歩を待っている", "白紙の地図、無限の可能性"]
        : ["The adventure awaits", "Blank map, endless possibility", "Not yet begun"];
    } else if (n < 5) {
      pool = isJa
        ? ["旅の始まり", "駆け出しの探検家", "最初の一歩を刻んだ", "小さな冒険家"]
        : ["Just getting started", "Rookie explorer", "First steps taken", "Trail beginner"];
    } else if (n < 15) {
      pool = isJa
        ? ["駆け出しのパークレンジャー", "冒険心に火がついた", "地図を塗り始めた旅人", "週末ワンダラー"]
        : ["Weekend Wanderer", "Trail Blazer in training", "Getting the itch", "Map filling in"];
    } else if (n < 30) {
      pool = isJa
        ? ["本格派アウトドア派", "国立公園ハンター", "自然に呼ばれる者", "旅の中盤戦"]
        : ["Seasoned Trailhead Hunter", "Park Chaser", "Called by the wild", "Halfway there"];
    } else if (n < 45) {
      pool = isJa
        ? ["ベテラン国立公園マスター", "地図の大半を制覇", "自然と共に生きる者", "本物の探検家"]
        : ["Park Veteran", "Nature's Regular", "Seasoned Adventurer", "Trail Master"];
    } else if (n < 63) {
      pool = isJa
        ? ["伝説のパークマスター", "残すはあと少し", "国立公園の生き字引", "頂点を目指す者"]
        : ["Legendary Park Master", "So close to it all", "Almost Everywhere", "Elite Explorer"];
    } else {
      pool = isJa
        ? ["全63公園制覇！殿堂入り", "アメリカ国立公園グランドマスター", "伝説となった旅人"]
        : ["ALL 63 PARKS — Hall of Fame", "National Parks Grand Master", "The Complete Journey"];
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }, [totalChecked, isJa]);

  // ── Shared helper: rounded rect ──
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return isJa
      ? `${d.getMonth()+1}/${d.getDate()}`
      : d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
  }

  // ══════════════════════════════════════════════════════
  // THEME 1: National Park Passport (deep green, elegant serif)
  // ══════════════════════════════════════════════════════
  function drawPassport(ctx, W, H) {
    const cx = W / 2;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#152816"); grad.addColorStop(1, "#0a1410");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    const rGrad = ctx.createRadialGradient(cx, H*0.1, 0, cx, H*0.1, H*0.6);
    rGrad.addColorStop(0, "rgba(90,150,90,0.18)"); rGrad.addColorStop(1, "rgba(90,150,90,0)");
    ctx.fillStyle = rGrad; ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#3a6a4a"; ctx.lineWidth = 3;
    ctx.strokeRect(24, 24, W-48, H-48);
    ctx.strokeStyle = "#2a4a3a"; ctx.lineWidth = 1;
    ctx.strokeRect(38, 38, W-76, H-76);

    ctx.textAlign = "center";
    ctx.fillStyle = "#7aae7a"; ctx.font = "500 24px Georgia, serif"; ctx.letterSpacing = "5px";
    ctx.fillText(isJa ? "アメリカ国立公園" : "U.S. NATIONAL PARKS", cx, 100);
    ctx.letterSpacing = "0px";

    ctx.fillStyle = "#e8f0e0"; ctx.font = "700 180px Georgia, serif";
    ctx.fillText(String(totalChecked), cx, 290);

    ctx.fillStyle = "#9ac89a"; ctx.font = "400 30px Georgia, serif";
    ctx.fillText(isJa ? `／ ${parks.length} 公園 訪問済み` : `of ${parks.length} parks visited`, cx, 332);

    drawPill(ctx, cx, 370, catchphrases, "#5a9a6a", "rgba(90,160,100,0.15)", "#c8e8c8", "italic 600 28px Georgia, serif");

    line(ctx, cx, 452);
    ctx.fillStyle = "#6a9a6a"; ctx.font = "500 22px Georgia, serif";
    ctx.fillText(isJa ? "地域別 達成率" : "PROGRESS BY REGION", cx, 490);

    drawRegionGrid(ctx, cx, 520, "#a8c8a8", "#7aae7a", "#1a2e1a", "#5acc5a");

    const dividerY = 520 + Math.ceil(regionStats.length/2) * 56 + 14;
    line(ctx, cx, dividerY);
    ctx.fillStyle = "#6a9a6a"; ctx.font = "500 22px Georgia, serif";
    ctx.fillText(isJa ? "直近訪れた公園" : "RECENTLY VISITED", cx, dividerY + 36);

    drawRecentGrid(ctx, cx, dividerY + 60, "#1a2e18", "#2a4a2a", "#eef4e8", "#6a9a6a");

    ctx.fillStyle = "#4a7a5a"; ctx.font = "22px Georgia, serif";
    ctx.fillText(`👤 ${profile.name}`, cx, H - 40);

    function line(ctx, cx, y) {
      ctx.strokeStyle = "#3a6a4a"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx-200, y); ctx.lineTo(cx+200, y); ctx.stroke();
    }
  }

  // ══════════════════════════════════════════════════════
  // THEME 2: Topographic Map (contour lines, outdoorsy)
  // ══════════════════════════════════════════════════════
  function drawTopo(ctx, W, H) {
    const cx = W / 2;
    ctx.fillStyle = "#0d1712"; ctx.fillRect(0, 0, W, H);

    // Contour line rings (decorative, radiating from top-center)
    ctx.strokeStyle = "rgba(120,160,120,0.10)"; ctx.lineWidth = 1.5;
    for (let r = 60; r < 1300; r += 55) {
      ctx.beginPath();
      ctx.ellipse(cx, 140, r, r*0.85, 0, 0, Math.PI*2);
      ctx.stroke();
    }
    // Grid overlay (map-like)
    ctx.strokeStyle = "rgba(120,160,120,0.06)"; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    ctx.strokeStyle = "#4a7a5a"; ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, W-40, H-40);
    // Corner ticks
    [[20,20],[W-20,20],[20,H-20],[W-20,H-20]].forEach(([x,y])=>{
      ctx.fillStyle = "#5a9a6a";
      ctx.fillRect(x-3,y-3,6,6);
    });

    ctx.textAlign = "center";
    ctx.fillStyle = "#6adc8a"; ctx.font = "600 22px 'Courier New', monospace"; ctx.letterSpacing = "6px";
    ctx.fillText(isJa ? "アメリカ国立公園 · 記録" : "U.S. NATIONAL PARKS · LOG", cx, 100);
    ctx.letterSpacing = "0px";

    // Elevation-style number
    ctx.fillStyle = "#eafbea"; ctx.font = "800 180px 'Courier New', monospace";
    ctx.fillText(String(totalChecked), cx, 290);
    ctx.fillStyle = "#5adc7a"; ctx.font = "600 26px 'Courier New', monospace";
    ctx.fillText(isJa ? `PARKS 訪問 / ${parks.length}` : `PARKS VISITED / ${parks.length}`, cx, 328);

    drawPill(ctx, cx, 368, catchphrases.toUpperCase(), "#4adc6a", "rgba(60,180,90,0.12)", "#8af0a0", "700 24px 'Courier New', monospace");

    dashLine(cx, 448);
    ctx.fillStyle = "#5adc7a"; ctx.font = "600 20px 'Courier New', monospace"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "地域別 達成率" : "PROGRESS BY REGION", cx, 486);
    ctx.letterSpacing = "0px";

    drawRegionGrid(ctx, cx, 516, "#c0e8c8", "#4adc6a", "#152a18", "#3adc5a");

    const dividerY = 516 + Math.ceil(regionStats.length/2) * 56 + 14;
    dashLine(cx, dividerY);
    ctx.fillStyle = "#5adc7a"; ctx.font = "600 20px 'Courier New', monospace"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "直近訪れた公園" : "RECENTLY VISITED", cx, dividerY + 36);
    ctx.letterSpacing = "0px";

    drawRecentGrid(ctx, cx, dividerY + 60, "#0f1f14", "#2a5a3a", "#eafbea", "#4adc6a", true);

    ctx.fillStyle = "#3a7a4a"; ctx.font = "600 20px 'Courier New', monospace";
    ctx.fillText(`◉ ${profile.name}`, cx, H - 40);

    function dashLine(cx, y) {
      ctx.strokeStyle = "#3a7a4a"; ctx.lineWidth = 1.5; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.moveTo(cx-200, y); ctx.lineTo(cx+200, y); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ══════════════════════════════════════════════════════
  // THEME 3: Retro WPA Poster (warm mustard/brick, flat bold)
  // ══════════════════════════════════════════════════════
  function drawRetro(ctx, W, H) {
    const cx = W / 2;
    ctx.fillStyle = "#e8d5a8"; ctx.fillRect(0, 0, W, H);

    // Sun-ray burst behind number (retro poster motif)
    ctx.save();
    ctx.translate(cx, 240);
    for (let i = 0; i < 16; i++) {
      ctx.rotate(Math.PI / 8);
      ctx.fillStyle = i % 2 === 0 ? "rgba(196,90,50,0.10)" : "rgba(196,90,50,0.05)";
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.arc(0,0,560,0,Math.PI/8); ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // Thick border frame
    ctx.strokeStyle = "#8a3a2a"; ctx.lineWidth = 10;
    ctx.strokeRect(30, 30, W-60, H-60);
    ctx.strokeStyle = "#c8a04a"; ctx.lineWidth = 3;
    ctx.strokeRect(48, 48, W-96, H-96);

    ctx.textAlign = "center";
    ctx.fillStyle = "#8a3a2a"; ctx.font = "800 26px Georgia, serif"; ctx.letterSpacing = "6px";
    ctx.fillText(isJa ? "アメリカ国立公園" : "U.S. NATIONAL PARKS", cx, 105);
    ctx.letterSpacing = "0px";

    ctx.fillStyle = "#8a3a2a"; ctx.font = "900 190px Georgia, serif";
    ctx.fillText(String(totalChecked), cx, 300);
    ctx.fillStyle = "#3a5a3a"; ctx.font = "700 30px Georgia, serif";
    ctx.fillText(isJa ? `／ ${parks.length} 公園 訪問済み` : `of ${parks.length} parks visited`, cx, 340);

    drawPill(ctx, cx, 378, catchphrases, "#8a3a2a", "rgba(138,58,42,0.12)", "#8a3a2a", "italic 700 28px Georgia, serif");

    thickLine(cx, 458);
    ctx.fillStyle = "#5a3a2a"; ctx.font = "700 22px Georgia, serif"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "地域別 達成率" : "PROGRESS BY REGION", cx, 496);
    ctx.letterSpacing = "0px";

    drawRegionGrid(ctx, cx, 526, "#5a3a2a", "#8a3a2a", "#d8c090", "#c85a30");

    const dividerY = 526 + Math.ceil(regionStats.length/2) * 56 + 14;
    thickLine(cx, dividerY);
    ctx.fillStyle = "#5a3a2a"; ctx.font = "700 22px Georgia, serif"; ctx.letterSpacing="2px";
    ctx.fillText(isJa ? "直近訪れた公園" : "RECENTLY VISITED", cx, dividerY + 36);
    ctx.letterSpacing = "0px";

    drawRecentGrid(ctx, cx, dividerY + 60, "#dcc898", "#8a3a2a", "#4a2a1a", "#8a3a2a");

    ctx.fillStyle = "#8a3a2a"; ctx.font = "700 22px Georgia, serif";
    ctx.fillText(`★ ${profile.name} ★`, cx, H - 40);

    function thickLine(cx, y) {
      ctx.strokeStyle = "#8a3a2a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx-200, y); ctx.lineTo(cx+200, y); ctx.stroke();
    }
  }

  // ── Shared: catchphrase pill ──
  function drawPill(ctx, cx, y, text, borderColor, bgColor, textColor, font) {
    ctx.font = font;
    const w = ctx.measureText(text).width + 56, h = 50;
    const x = cx - w/2;
    ctx.fillStyle = bgColor; ctx.strokeStyle = borderColor; ctx.lineWidth = 1.5;
    roundRect(ctx, x, y, w, h, h/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.fillText(text, cx, y + h*0.66);
  }

  // ── Shared: region progress 2-col grid ──
  function drawRegionGrid(ctx, cx, startY, labelColor, valueColor, trackColor, fillColor) {
    const barAreaX = 90, barAreaW = 1080 - 180;
    const colGap = 16, colW = (barAreaW - colGap) / 2;
    regionStats.forEach((r, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const bx = barAreaX + col * (colW + colGap);
      const by = startY + row * 56;
      const pct = r.total > 0 ? r.done / r.total : 0;

      ctx.textAlign = "left";
      ctx.fillStyle = labelColor; ctx.font = "500 19px Georgia, serif";
      ctx.fillText(r.label, bx, by);
      ctx.textAlign = "right";
      ctx.fillStyle = valueColor; ctx.font = "500 17px Georgia, serif";
      ctx.fillText(`${r.done}/${r.total}`, bx + colW, by);

      const barY = by + 9, barH = 9;
      ctx.fillStyle = trackColor;
      roundRect(ctx, bx, barY, colW, barH, 4); ctx.fill();
      if (pct > 0) {
        ctx.fillStyle = fillColor;
        roundRect(ctx, bx, barY, colW * pct, barH, 4); ctx.fill();
      }
    });
    ctx.textAlign = "center";
  }

  // ── Shared: recent visits 2×2 grid ──
  function drawRecentGrid(ctx, cx, startY, cardBg, cardBorder, textColor, dateColor, mono) {
    const gridW = 900, gridGap = 20;
    const cardW = (gridW - gridGap) / 2, cardH = 130;
    const startX = cx - gridW/2;
    const fontFamily = mono ? "'Courier New', monospace" : "Georgia, serif";

    for (let i = 0; i < 4; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const x = startX + col * (cardW + gridGap);
      const y = startY + row * (cardH + gridGap);

      ctx.fillStyle = cardBg; ctx.strokeStyle = cardBorder; ctx.lineWidth = 1.2;
      roundRect(ctx, x, y, cardW, cardH, 10); ctx.fill(); ctx.stroke();

      const entry = recentParks[i];
      ctx.textAlign = "center";
      if (entry) {
        const name = isJa ? entry.park.ja : entry.park.name;
        ctx.fillStyle = textColor; ctx.font = `600 26px ${fontFamily}`;
        ctx.fillText(entry.park.emoji, x + cardW/2, y + 42);
        // Truncate long names
        let displayName = name;
        ctx.font = `600 22px ${fontFamily}`;
        while (ctx.measureText(displayName).width > cardW - 24 && displayName.length > 3) {
          displayName = displayName.slice(0, -2) + "…";
        }
        ctx.fillText(displayName, x + cardW/2, y + 76);
        ctx.fillStyle = dateColor; ctx.font = `18px ${fontFamily}`;
        ctx.fillText(fmtDate(entry.latest), x + cardW/2, y + 104);
      } else {
        ctx.fillStyle = dateColor; ctx.font = `italic 18px ${fontFamily}`;
        ctx.globalAlpha = 0.5;
        ctx.fillText("—", x + cardW/2, y + cardH/2 + 6);
        ctx.globalAlpha = 1;
      }
    }
  }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const W = 1080, H = 1350; // taller canvas so 2x2 grid + stats never clip
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");

    if (theme === "passport") drawPassport(ctx, W, H);
    else if (theme === "topo") drawTopo(ctx, W, H);
    else drawRetro(ctx, W, H);

    setImgUrl(canvas.toDataURL("image/png"));
  }, [theme, totalChecked, recentParks, regionStats, catchphrases, isJa, profile.name]);

  const handleDownload = () => {
    if (!imgUrl) return;
    const a = document.createElement("a");
    a.href = imgUrl;
    a.download = `national-parks-${profile.name}-${theme}-${today()}.png`;
    a.click();
  };

  const handleShare = async () => {
    if (!imgUrl || typeof navigator==="undefined" || !navigator.share) { handleDownload(); return; }
    try {
      const blob = await (await fetch(imgUrl)).blob();
      const file = new File([blob], "national-parks.png", { type: "image/png" });
      await navigator.share({ files: [file], title: isJa ? "国立公園チェックリスト" : "National Parks Checklist" });
    } catch { handleDownload(); }
  };

  const themeLabels = {
    passport: isJa ? "🏔 パスポート" : "🏔 Passport",
    topo:     isJa ? "🗺 地形図" : "🗺 Topo Map",
    retro:    isJa ? "🎨 レトロ" : "🎨 Retro",
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2500,padding:16,overflowY:"auto"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#0d150d",border:"1px solid #2a4a2a",borderRadius:16,padding:16,maxWidth:420,width:"100%",margin:"auto"}}>

        {/* Theme selector */}
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          {Object.entries(themeLabels).map(([key,label]) => (
            <button key={key} onClick={()=>setTheme(key)} style={{
              flex:1, padding:"7px 4px", borderRadius:8, fontSize:11, cursor:"pointer", fontFamily:"inherit",
              background: theme===key?"#2a5a2a":"transparent",
              border:`1px solid ${theme===key?"#5a9a5a":"#2a3a2a"}`,
              color: theme===key?"#a8d4a8":"#6a8a6a",
            }}>{label}</button>
          ))}
        </div>

        <canvas ref={canvasRef} style={{width:"100%",borderRadius:10,display:"block"}} />
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button onClick={handleShare} style={{flex:1,padding:"12px",background:"#2a5a2a",border:"1px solid #4a8a4a",borderRadius:8,color:"#a8d4a8",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
            {(typeof navigator!=="undefined"&&navigator.share) ? (isJa?"📤 共有":"📤 Share") : (isJa?"⬇ 保存":"⬇ Save")}
          </button>
          <button onClick={onClose} style={{padding:"12px 20px",background:"transparent",border:"1px solid #2a3a2a",borderRadius:8,color:"#6a8a6a",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
            {tx.cancel}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Helpers ───────────────────────────────────────────────────────
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}
// Normalize a visits object so every entry is {date, note} — migrates old string[] format
function migrateVisits(visits) {
  const out = {};
  Object.entries(visits || {}).forEach(([pid, arr]) => {
    out[pid] = (arr || []).map(v => typeof v === "string" ? { date: v, note: "" } : v);
  });
  return out;
}
function initStore() {
  const existing = loadData();
  if (existing?.profiles) {
    return { ...existing, profiles: existing.profiles.map(p => ({ ...p, visits: migrateVisits(p.visits) })) };
  }
  // Migrate old single-profile data (pre-profiles version)
  const oldKey = "np_checklist_v1";
  let oldVisits = {};
  try { const r = localStorage.getItem(oldKey); if (r) oldVisits = JSON.parse(r); } catch {}
  const id = uid();
  return { activeId: id, profiles: [{ id, name: "Me", visits: migrateVisits(oldVisits) }] };
}

// ── Main App ──────────────────────────────────────────────────────
function App() {
  const [store,         setStore]         = useState(() => initStore());
  const [lang,          setLang]          = useState(() => { try { return localStorage.getItem(LANG_KEY)||"en"; } catch { return "en"; } });
  const [siteTheme,     setSiteTheme]     = useState(() => { try { return localStorage.getItem(THEME_KEY)||"passport"; } catch { return "passport"; } });
  const [tab,           setTab]           = useState("list");
  const [activeRegion,  setActiveRegion]  = useState("all");
  const [search,        setSearch]        = useState("");
  const [selectedPark,  setSelectedPark]  = useState(null);
  const [dateModalPark, setDateModalPark] = useState(null);
  const [hoveredMapId,  setHoveredMapId]  = useState(null);
  const [showProfiles,  setShowProfiles]  = useState(false);
  const [showShareCard, setShowShareCard] = useState(false);
  const [showThemePicker, setShowThemePicker] = useState(false);
  const [confirm,       setConfirm]       = useState(null); // { message, onConfirm }
  const parkRefs = useRef({});

  const isJa = lang === "ja";
  const tx   = i18n[lang];
  const T    = THEMES[siteTheme];

  useEffect(() => { try { localStorage.setItem(THEME_KEY, siteTheme); } catch {} }, [siteTheme]);

  // Persist
  useEffect(() => { saveData(store); }, [store]);
  useEffect(() => { try { localStorage.setItem(LANG_KEY, lang); } catch {} }, [lang]);

  const activeProfile = store.profiles.find(p=>p.id===store.activeId) || store.profiles[0];
  const visits = activeProfile.visits;

  const setVisits = (updater) => {
    setStore(prev => {
      const newVisits = typeof updater === "function" ? updater(activeProfile.visits) : updater;
      return {
        ...prev,
        profiles: prev.profiles.map(p => p.id===prev.activeId ? {...p, visits:newVisits} : p),
      };
    });
  };

  const checked = useMemo(() => {
    const o={};
    parks.forEach(p=>{o[p.id]=(visits[p.id]?.length??0)>0;});
    return o;
  }, [visits]);

  const totalChecked = Object.values(checked).filter(Boolean).length;
  const progress     = Math.round((totalChecked/parks.length)*100);

  const regions = useMemo(()=>REGION_ORDER.map(key=>{
    const s=parks.find(p=>p.region===key);
    return {key, label:isJa?s.regionJa:key};
  }),[isJa]);

  const filteredParks = useMemo(()=>{
    const q=search.toLowerCase();
    return parks.filter(p=>{
      const matchRegion=activeRegion==="all"||p.region===activeRegion;
      const matchSearch=!search||p.name.toLowerCase().includes(q)||p.ja.includes(search)||p.state.toLowerCase().includes(q)||p.stateJa.includes(search);
      return matchRegion&&matchSearch;
    }).sort((a,b)=>a.name.localeCompare(b.name,"en",{sensitivity:"base"}));
  },[activeRegion,search]);

  const regionCount=(key)=>parks.filter(p=>p.region===key&&checked[p.id]).length;

  const addVisit=(id,date,note="")=>setVisits(prev=>{
    const ex=prev[id]??[];
    if(ex.some(v=>v.date===date)) return prev;
    return {...prev,[id]:[...ex,{date,note}]};
  });
  const removeVisit=(id,date)=>setVisits(prev=>({...prev,[id]:(prev[id]??[]).filter(v=>v.date!==date)}));
  const updateVisitNote=(id,date,note)=>setVisits(prev=>({...prev,[id]:(prev[id]??[]).map(v=>v.date===date?{...v,note}:v)}));

  const toggleCheck=(park)=>{
    if(!checked[park.id]){addVisit(park.id,today());setDateModalPark(park);}
    else setVisits(prev=>({...prev,[park.id]:[]}));
  };

  const resetAll=()=>{
    setConfirm({
      message: `${tx.confirmReset} "${activeProfile.name}"?`,
      onConfirm: ()=>{ setVisits({}); setConfirm(null); },
    });
  };

  const scrollToPark=(id)=>{
    setTab("list");setActiveRegion("all");setSearch("");
    setTimeout(()=>parkRefs.current[id]?.scrollIntoView({behavior:"smooth",block:"center"}),100);
  };

  // Profile actions
  const createProfile=(name)=>{
    const id=uid();
    setStore(prev=>({...prev, profiles:[...prev.profiles,{id,name,visits:{}}], activeId:id}));
  };
  const switchProfile=(id)=>setStore(prev=>({...prev,activeId:id}));
  const renameProfile=(id,name)=>setStore(prev=>({...prev,profiles:prev.profiles.map(p=>p.id===id?{...p,name}:p)}));
  const deleteProfile=(id)=>{
    const prof=store.profiles.find(p=>p.id===id);
    setConfirm({
      message:`${tx.confirmDelete} "${prof?.name}"?`,
      onConfirm:()=>{
        setStore(prev=>{
          const newProfiles=prev.profiles.filter(p=>p.id!==id);
          const newActive=prev.activeId===id?newProfiles[0].id:prev.activeId;
          return {...prev,profiles:newProfiles,activeId:newActive};
        });
        setConfirm(null);
      },
    });
  };

  const S={
    btn:(active)=>({padding:"5px 20px",borderRadius:20,fontSize:12,cursor:"pointer",fontFamily:"inherit",background:active?T.btnBgActive:"transparent",border:`1px solid ${active?T.btnBorderActive:T.cardBorder}`,color:active?T.accentText:T.mutedText,transition:"all .2s"}),
    chip:(active)=>({padding:"4px 11px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit",background:active?T.chipBgActive:"transparent",border:`1px solid ${active?T.chipBorderActive:T.cardBorder}`,color:active?T.chipTextActive:T.chipText}),
    link:(color,bg,border)=>({flex:1,padding:"7px 0",textAlign:"center",borderRadius:8,fontSize:10,background:bg,border:`1px solid ${border}`,color,textDecoration:"none",display:"block"}),
    rowBtn:(color)=>({flex:1,padding:"7px 0",fontSize:10,cursor:"pointer",color,background:"transparent",border:"none",borderLeft:`1px solid ${T.cardBorder}`,fontFamily:"inherit"}),
  };

  return (
    <div style={{minHeight:"100vh",background:T.bg,fontFamily:isJa?"'Hiragino Sans','Noto Sans JP',sans-serif":T.fontBody,color:T.textPrimary,display:"flex",flexDirection:"column",transition:"background .3s ease"}}>

      {/* ── HEADER ── */}
      <div style={{background:T.headerBg,borderBottom:`1px solid ${T.headerBorder}`,padding:"28px 20px 20px",textAlign:"center",position:"relative"}}>
        <div style={{position:"absolute",inset:0,backgroundImage:`radial-gradient(ellipse at 50% 0%,${T.chipBgActive}33,transparent 70%)`,pointerEvents:"none"}}/>

        {/* Top-right buttons */}
        <div style={{position:"absolute",top:14,right:14,display:"flex",gap:6,zIndex:1}}>
          <button onClick={()=>setShowThemePicker(true)}
            style={{padding:"4px 10px",background:"transparent",border:`1px solid ${T.headerBorder}`,borderRadius:20,color:T.mutedText,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            {T.label}
          </button>
          <button onClick={()=>setLang(l=>l==="en"?"ja":"en")}
            style={{padding:"4px 10px",background:"transparent",border:`1px solid ${T.headerBorder}`,borderRadius:20,color:T.mutedText,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            {tx.langBtn}
          </button>
          <button onClick={()=>setShowProfiles(true)}
            style={{padding:"4px 10px",background:"transparent",border:`1px solid ${T.headerBorder}`,borderRadius:20,color:T.mutedText,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            👤
          </button>
        </div>

        <div style={{fontSize:11,letterSpacing:"0.3em",color:T.mutedText,textTransform:"uppercase",marginBottom:4}}>{tx.country}</div>
        <h1 style={{margin:0,fontSize:"clamp(18px,4vw,28px)",fontWeight:400,color:T.textPrimary,lineHeight:1.2}}>{tx.title}</h1>
        <div style={{fontSize:11,color:T.textSecondary,marginTop:2}}>{tx.subtitle}</div>

        {/* Active profile name */}
        <div style={{fontSize:12,color:T.mutedText,marginTop:4,cursor:"pointer"}} onClick={()=>setShowProfiles(true)}>
          👤 {activeProfile.name}
        </div>

        {/* Progress */}
        <div style={{maxWidth:320,margin:"14px auto 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
            <span style={{fontSize:11,color:T.textSecondary}}>{tx.visited}</span>
            <span style={{fontSize:24,fontWeight:300,color:T.accentText}}>{totalChecked}<span style={{fontSize:14,color:T.mutedText}}>/{parks.length}</span></span>
          </div>
          <div style={{height:3,background:T.progressTrack,borderRadius:2,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${progress}%`,background:T.progressFill,borderRadius:2,transition:"width .5s ease"}}/>
          </div>
          <div style={{textAlign:"right",fontSize:10,color:T.mutedText,marginTop:3}}>{progress}%</div>
        </div>

        {/* Tabs + Reset + Share */}
        <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:6,marginTop:14,flexWrap:"wrap"}}>
          <button style={S.btn(tab==="list")} onClick={()=>setTab("list")}>{tx.listTab}</button>
          <button style={S.btn(tab==="map")}  onClick={()=>setTab("map")}>{tx.mapTab}</button>
          <button style={S.btn(tab==="timeline")} onClick={()=>setTab("timeline")}>{tx.timelineTab}</button>
          {totalChecked>0&&(
            <button onClick={()=>setShowShareCard(true)}
              style={{padding:"5px 14px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit",background:"transparent",border:`1px solid ${T.cardBorderActive}`,color:T.accentText}}>
              📤 {isJa?"シェア":"Share"}
            </button>
          )}
          {totalChecked>0&&(
            <button onClick={resetAll}
              style={{padding:"5px 14px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit",background:"transparent",border:"1px solid #8a4a3a",color:"#c07a5a"}}>
              🗑 {tx.resetAll}
            </button>
          )}
        </div>
      </div>

      {/* ── MAP TAB ── */}
      {tab==="map"&&(
        <div style={{flex:1,display:"flex",flexDirection:"column"}}>
          <div style={{padding:"8px 16px 2px",fontSize:11,color:T.mutedText,textAlign:"center"}}>
            {tx.mapHint}
          </div>
          <SVGMap parks={parks} checked={checked} visits={visits} isJa={isJa} onParkClick={p=>setSelectedPark(s=>s?.id===p.id?null:p)} hoveredId={hoveredMapId} setHoveredId={setHoveredMapId} themeColors={T}/>
          {selectedPark&&(
            <div style={{margin:"0 12px 12px",background:T.cardBgAlt,border:`1px solid ${T.cardBorderActive}`,borderRadius:10,padding:"16px 18px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                <div>
                  <div style={{fontSize:18,color:T.textPrimary,marginBottom:3,fontWeight:600}}>{selectedPark.emoji} {isJa?selectedPark.ja:selectedPark.name}</div>
                  <div style={{fontSize:12,color:T.mutedText}}>{isJa?selectedPark.name:selectedPark.ja} · {isJa?selectedPark.stateJa:selectedPark.state}</div>
                  {(visits[selectedPark.id]?.length??0)>0&&<div style={{fontSize:11,color:T.pinVisited,marginTop:4}}>✓ {tx.visits(visits[selectedPark.id].length)}</div>}
                </div>
                <button onClick={()=>toggleCheck(selectedPark)} style={{padding:"6px 14px",borderRadius:20,fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0,background:checked[selectedPark.id]?T.btnBgActive:"transparent",border:`1px solid ${checked[selectedPark.id]?T.btnBorderActive:T.cardBorder}`,color:checked[selectedPark.id]?T.accentText:T.mutedText}}>
                  {checked[selectedPark.id]?"✓ "+tx.checkedLabel:tx.uncheckedLabel}
                </button>
              </div>
              <div style={{display:"flex",gap:6,marginTop:14,flexWrap:"wrap"}}>
                <a href={npsUrl(selectedPark)} target="_blank" rel="noopener noreferrer" style={{...S.link(T.accentText,T.cardBg,T.cardBorderActive),fontSize:12,padding:"8px 0"}}>🏛 {tx.npsLink}</a>
                <a href={gmapUrl(selectedPark)} target="_blank" rel="noopener noreferrer" style={{...S.link(T.accentText,T.cardBg,T.cardBorderActive),fontSize:12,padding:"8px 0"}}>📍 {tx.gmapLink}</a>
                <button onClick={()=>{setDateModalPark(selectedPark);setSelectedPark(null);}} style={{flex:1,padding:"8px 0",borderRadius:8,fontSize:12,cursor:"pointer",background:T.cardBg,border:`1px solid ${T.cardBorder}`,color:T.mutedText,fontFamily:"inherit"}}>📅 {isJa?"訪問日":"Dates"}</button>
                <button onClick={()=>{scrollToPark(selectedPark.id);setSelectedPark(null);}} style={{flex:1,padding:"8px 0",borderRadius:8,fontSize:12,cursor:"pointer",background:T.cardBg,border:`1px solid ${T.cardBorder}`,color:T.mutedText,fontFamily:"inherit"}}>≡ {tx.listTab}</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── TIMELINE TAB ── */}
      {tab==="timeline"&&(
        <TimelineView parks={parks} visits={visits} isJa={isJa} themeColors={T} onParkClick={(park)=>{setTab("map");setSelectedPark(park);}}/>
      )}

      {/* ── LIST TAB ── */}
      {tab==="list"&&(
        <div style={{flex:1,display:"flex",flexDirection:"column"}}>
          <div style={{padding:"14px 16px 0",maxWidth:700,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
            <input type="text" placeholder={tx.search} value={search} onChange={e=>setSearch(e.target.value)}
              style={{width:"100%",padding:"10px 14px",background:T.inputBg,border:`1px solid ${T.inputBorder}`,borderRadius:8,color:T.textPrimary,fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
          </div>
          <div style={{padding:"10px 16px",maxWidth:700,margin:"0 auto",width:"100%",boxSizing:"border-box",display:"flex",gap:6,flexWrap:"wrap"}}>
            {[{key:"all",label:tx.all},...regions].map(r=>{
              const cnt=r.key==="all"?totalChecked:regionCount(r.key);
              const total=r.key==="all"?parks.length:parks.filter(p=>p.region===r.key).length;
              return <button key={r.key} onClick={()=>setActiveRegion(r.key)} style={S.chip(activeRegion===r.key)}>{r.label} <span style={{opacity:.6}}>({cnt}/{total})</span></button>;
            })}
          </div>
          <div style={{maxWidth:700,margin:"0 auto",padding:"0 16px 80px",width:"100%",boxSizing:"border-box"}}>
            {filteredParks.length===0&&<div style={{textAlign:"center",padding:40,color:T.mutedText,fontSize:13}}>{tx.notFound}</div>}
            <div style={{display:"flex",flexDirection:"column",gap:1}}>
              {filteredParks.map(park=>{
                const isCheckedP=checked[park.id], visitCount=visits[park.id]?.length??0;
                const latestVisit=visitCount>0?[...(visits[park.id])].sort((a,b)=>b.date.localeCompare(a.date))[0]:null;
                const latestDate=latestVisit?.date;
                return (
                  <div key={park.id} ref={el=>parkRefs.current[park.id]=el}
                    style={{background:isCheckedP?T.cardBgAlt:T.cardBg,borderLeft:`3px solid ${isCheckedP?T.cardBorderActive:T.cardBorder}`,borderRadius:2,opacity:isCheckedP?.85:1}}>
                    <div onClick={()=>toggleCheck(park)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",cursor:"pointer"}}>
                      <div style={{width:19,height:19,flexShrink:0,border:`1.5px solid ${isCheckedP?T.cardBorderActive:T.cardBorder}`,borderRadius:4,background:isCheckedP?T.btnBgActive:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:T.accentText}}>
                        {isCheckedP&&"✓"}
                      </div>
                      <span style={{fontSize:17,flexShrink:0}}>{park.emoji}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:14,color:isCheckedP?T.accentText:T.textPrimary,textDecoration:isCheckedP?"line-through":"none",textDecorationColor:T.mutedText}}>{isJa?park.ja:park.name}</div>
                        <div style={{fontSize:10,color:T.mutedText,marginTop:1}}>{isJa?park.name:park.ja} · {isJa?park.stateJa:park.state}</div>
                        {latestDate&&<div style={{fontSize:10,color:T.mutedText,marginTop:3,display:"flex",alignItems:"center",gap:4}}>
                          <span>📅 {formatDate(latestDate,isJa)}</span>
                          {visitCount>1&&<span style={{color:T.accentText,background:T.cardBg,border:`1px solid ${T.cardBorder}`,borderRadius:8,padding:"0 5px"}}>×{visitCount}</span>}
                        </div>}
                        {latestVisit?.note&&<div style={{fontSize:10,color:T.textSecondary,marginTop:3,fontStyle:"italic",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>💬 {latestVisit.note}</div>}
                      </div>
                      {activeRegion==="all"&&<span style={{fontSize:9,color:T.mutedText,background:T.inputBg,border:`1px solid ${T.cardBorder}`,borderRadius:10,padding:"2px 7px",flexShrink:0,whiteSpace:"nowrap"}}>{isJa?park.regionJa:park.region}</span>}
                    </div>
                    <div style={{display:"flex",borderTop:`1px solid ${T.cardBorder}`}}>
                      <a href={npsUrl(park)} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{flex:1,padding:"7px 0",textAlign:"center",fontSize:10,color:T.accentText,textDecoration:"none",borderRight:`1px solid ${T.cardBorder}`}}>🏛 {tx.npsLink}</a>
                      <a href={gmapUrl(park)} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{flex:1,padding:"7px 0",textAlign:"center",fontSize:10,color:T.accentText,textDecoration:"none",borderRight:`1px solid ${T.cardBorder}`}}>📍 {tx.gmapLink}</a>
                      <button onClick={e=>{e.stopPropagation();setDateModalPark(park);}} style={S.rowBtn(visitCount>0?T.accentText:T.mutedText)}>📅 {visitCount>0?tx.visits(visitCount):(isJa?"訪問日":"Dates")}</button>
                      <button onClick={e=>{e.stopPropagation();setTab("map");setSelectedPark(park);}} style={S.rowBtn(T.mutedText)}>🗺 {tx.mapTab}</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Floating badge */}
      {totalChecked>0&&(
        <div style={{position:"fixed",bottom:20,right:16,background:T.cardBgAlt,border:`1px solid ${T.cardBorderActive}`,borderRadius:50,padding:"8px 16px",fontSize:12,color:T.accentText,boxShadow:"0 4px 20px rgba(0,0,0,.5)",pointerEvents:"none"}}>
          {tx.badge(totalChecked)}
        </div>
      )}

      {/* Modals */}
      {dateModalPark&&<DateModal park={dateModalPark} dates={visits[dateModalPark.id]??[]} isJa={isJa} tx={tx} onClose={()=>setDateModalPark(null)} onAdd={(date,note)=>addVisit(dateModalPark.id,date,note)} onDelete={date=>removeVisit(dateModalPark.id,date)} onUpdateNote={(date,note)=>updateVisitNote(dateModalPark.id,date,note)}/>}
      {showProfiles&&<ProfileModal profiles={store.profiles} activeId={store.activeId} onSwitch={switchProfile} onCreate={createProfile} onRename={renameProfile} onDelete={deleteProfile} onClose={()=>setShowProfiles(false)} tx={tx} isJa={isJa}/>}
      {showShareCard&&<ShareCardModal profile={activeProfile} visits={visits} checked={checked} isJa={isJa} tx={tx} onClose={()=>setShowShareCard(false)}/>}
      {showThemePicker&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:2000}} onClick={()=>setShowThemePicker(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:T.cardBgAlt,border:`1px solid ${T.headerBorder}`,borderRadius:"16px 16px 0 0",width:"100%",maxWidth:500,padding:"20px 20px 32px"}}>
            <div style={{width:36,height:4,background:T.cardBorder,borderRadius:2,margin:"0 auto 16px"}}/>
            <div style={{fontSize:16,color:T.accentText,marginBottom:16,textAlign:"center"}}>{isJa?"サイトのテーマ":"Site Theme"}</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {Object.entries(THEMES).map(([key,theme])=>(
                <button key={key} onClick={()=>{setSiteTheme(key);setShowThemePicker(false);}} style={{
                  display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",textAlign:"left",
                  background:siteTheme===key?T.btnBgActive:T.cardBg,
                  border:`1px solid ${siteTheme===key?T.btnBorderActive:T.cardBorder}`,
                }}>
                  <span style={{fontSize:22}}>{theme.label}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,color:siteTheme===key?T.accentText:T.textPrimary}}>{isJa?theme.nameJa:theme.name}</div>
                  </div>
                  {siteTheme===key&&<span style={{color:T.accentText,fontSize:16}}>✓</span>}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
      {confirm&&<ConfirmDialog message={confirm.message} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)} tx={tx}/>}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
